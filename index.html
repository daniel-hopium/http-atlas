<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}</style>
<script>try{const t=JSON.parse(localStorage.getItem('http-atlas:theme'));if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}
try{if(JSON.parse(localStorage.getItem('http-atlas:width'))==='wide')document.documentElement.setAttribute('data-width','wide')}catch(e){}
try{const w=JSON.parse(localStorage.getItem('http-atlas:lessonW'));if(w>0)document.documentElement.style.setProperty('--lesson-w',w+'px')}catch(e){}</script>
<title>HTTP-Atlas – HTTP & Browser zum Anfassen</title>
<meta name="description" content="Requests, Statuscodes, Caching, Cookies und CORS zum Durchspielen: Regler setzen, Request und Response ablesen.">
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Figtree:wght@600;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F3F5F7; --surface:#FFFFFF; --surface-2:#EBEFF3; --ink:#15191F; --muted:#545C6A;
  --line:#D8DDE4; --line-strong:#838C9B;
  --success:#1B6B40; --success-bg:#E3F2E9; --warn:#7A4D00; --warn-bg:#FBF0D9;
  --danger:#B3261E; --danger-bg:#FBE8E6; --danger-ink:#FFFFFF;
  --toast-bg:#1D2229; --toast-ink:#F2F4F7; --toast-ok:#7BD9A1; --toast-err:#FF9A8F;
  --shadow:0 1px 2px rgb(16 24 40 / .06), 0 10px 28px rgb(16 24 40 / .14);

  --brand-l:#4338CA; --brand-ink-l:#FFFFFF; --brand-soft-l:#ECEBFC;
  --brand-d:#A5B4FC; --brand-ink-d:#14123A; --brand-soft-d:#1D1C3A;
  --radius-ctl:10px; --radius-sm:8px; --radius-lg:14px; --radius-mark:10px;
  --font-display:"Figtree", "Atkinson Hyperlegible", system-ui, sans-serif; --display-wt:800;

  --brand:var(--brand-l); --brand-ink:var(--brand-ink-l); --brand-soft:var(--brand-soft-l);
  --toast-action:var(--brand-d);
  --focus:var(--brand);
  --font-body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono:"JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E1115; --surface:#161A20; --surface-2:#1E232B; --ink:#E7EAEE; --muted:#A0A8B4;
    --line:#2B313A; --line-strong:#6B7483;
    --success:#74D39B; --success-bg:#15291E; --warn:#F2C063; --warn-bg:#2C2210;
    --danger:#FF8A80; --danger-bg:#34171A; --danger-ink:#2B0A07;
    --toast-bg:#E9ECF0; --toast-ink:#15191F; --toast-ok:#1B6B40; --toast-err:#B3261E;
    --shadow:0 1px 2px rgb(0 0 0 / .4), 0 10px 28px rgb(0 0 0 / .5);
    --brand:var(--brand-d); --brand-ink:var(--brand-ink-d); --brand-soft:var(--brand-soft-d);
    --toast-action:var(--brand-l);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1115; --surface:#161A20; --surface-2:#1E232B; --ink:#E7EAEE; --muted:#A0A8B4;
  --line:#2B313A; --line-strong:#6B7483;
  --success:#74D39B; --success-bg:#15291E; --warn:#F2C063; --warn-bg:#2C2210;
  --danger:#FF8A80; --danger-bg:#34171A; --danger-ink:#2B0A07;
  --toast-bg:#E9ECF0; --toast-ink:#15191F; --toast-ok:#1B6B40; --toast-err:#B3261E;
  --shadow:0 1px 2px rgb(0 0 0 / .4), 0 10px 28px rgb(0 0 0 / .5);
  --brand:var(--brand-d); --brand-ink:var(--brand-ink-d); --brand-soft:var(--brand-soft-d);
  --toast-action:var(--brand-l);
}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:1rem;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:var(--brand);text-decoration:underline;text-underline-offset:.16em;text-decoration-thickness:.08em}
a:hover{text-decoration-thickness:.14em}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
h1[tabindex="-1"]:focus,main:focus,[tabindex="-1"]:focus:not(:focus-visible){outline:none}
code{font-family:var(--font-mono);font-size:.86em;background:var(--surface-2);padding:.1em .35em;border-radius:4px;overflow-wrap:anywhere}
kbd{font-family:var(--font-mono);font-size:.8rem;border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:4px;padding:0 .4em;background:var(--surface);white-space:nowrap}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* Skip link */
.skip{position:absolute;left:12px;top:-100px;z-index:100;background:var(--brand);color:var(--brand-ink);padding:10px 16px;border-radius:var(--radius-ctl);font-weight:700;text-decoration:none}
.skip:focus{top:calc(8px + env(safe-area-inset-top,0px))}

/* App shell */
.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr)}
.appbar{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;padding:8px 16px;background:var(--surface);border-bottom:1px solid var(--line);position:relative}
.logo{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0;position:relative}
.logo-mark{width:36px;height:36px;border-radius:var(--radius-mark);background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font:var(--display-wt) 1.15rem/1 var(--font-display);flex:none}
img.logo-mark{background:none;object-fit:contain}
.logo-name{font:var(--display-wt) 1.125rem/1.15 var(--font-display);letter-spacing:-.01em;margin:0}
.logo-sub{display:block;font:400 .75rem/1.3 var(--font-body);color:var(--muted);letter-spacing:.02em}
.hdr-ctl{display:flex;align-items:center;gap:8px;position:relative}
.hdr-ctl label{font-weight:700;font-size:.9375rem}
.shell{display:grid;grid-template-columns:minmax(280px,340px) minmax(0,1fr);min-height:0}
.master{overflow:auto;background:var(--surface);border-right:1px solid var(--line);position:relative;overscroll-behavior:contain}
.detail{overflow:auto;position:relative;overscroll-behavior:contain}
.detail-top{display:none}
@media (max-width:799px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .master{border-right:0}
  .shell[data-view="detail"] .master{display:none}
  .shell[data-view="master"] .detail{display:none}
  .detail-top{display:block;padding:10px 16px 0}
}

/* Controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:var(--radius-ctl);border:1.5px solid transparent;font:inherit;font-weight:700;line-height:1.2;cursor:pointer;text-decoration:none;transition:background-color .15s,border-color .15s,transform .1s;text-align:center}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--brand);color:var(--brand-ink)}
.btn-primary:hover{background:color-mix(in srgb,var(--brand) 86%,var(--ink))}
.btn-secondary{background:var(--surface);color:var(--ink);border-color:var(--line-strong)}
.btn-secondary:hover{background:var(--surface-2)}
.btn-ghost{background:transparent;color:var(--brand)}
.btn-ghost:hover{background:var(--brand-soft)}
.btn-danger{background:var(--danger);color:var(--danger-ink)}
.btn-danger:hover{background:color-mix(in srgb,var(--danger) 86%,var(--ink))}
.btn[aria-disabled="true"]{opacity:.5;cursor:not-allowed}
.btn[aria-disabled="true"]:active{transform:none}
.btn-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.icon-btn{width:44px;height:44px;display:inline-grid;place-items:center;border-radius:var(--radius-ctl);background:transparent;border:0;color:var(--ink);cursor:pointer;flex:none}
.icon-btn:hover{background:var(--surface-2)}
.theme-btn .ic-sun,.theme-btn[aria-pressed="true"] .ic-moon{display:none}
.theme-btn[aria-pressed="true"] .ic-sun{display:block}
.width-btn .ic-narrow,.width-btn[aria-pressed="true"] .ic-wide{display:none}
.width-btn[aria-pressed="true"] .ic-narrow{display:block}
/* Unter 1280px ist „breit“ kaum breiter als normal – dann braucht es den Knopf nicht */
@media (max-width:1279px){.width-btn{display:none}}
/* Breite Ansicht: die Lektion nutzt die ganze Spalte statt 48rem */
:root[data-width="wide"] .lesson{position:relative;max-width:var(--lesson-w,none);padding-left:clamp(16px,3vw,56px);padding-right:clamp(16px,3vw,56px)}
/* Zieh-Griff am rechten Rand der Lektion – nur in der breiten Ansicht */
.lesson-grip{display:none}
:root[data-width="wide"] .lesson-grip{display:block;position:absolute;top:0;bottom:0;right:0;width:14px;cursor:ew-resize;touch-action:none}
.lesson-grip::before{content:"";position:absolute;top:0;bottom:0;left:6px;width:2px;background:var(--line);transition:background-color .15s}
.lesson-grip span{position:sticky;top:calc(50% - 24px);display:block;width:8px;height:48px;margin-left:3px;border-radius:4px;background:var(--line-strong);transition:background-color .15s}
.lesson-grip:hover::before,.lesson-grip:focus-visible::before,.lesson-grip.is-dragging::before,.lesson-grip:hover span,.lesson-grip:focus-visible span,.lesson-grip.is-dragging span{background:var(--brand)}
.lesson-grip:focus-visible{outline-offset:0}
:root.is-resizing,:root.is-resizing *{cursor:ew-resize!important;user-select:none}
@media (max-width:1279px){:root[data-width="wide"] .lesson-grip{display:none}}
.spinner{width:18px;height:18px;border:2.5px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .8s linear infinite;display:none;flex:none}
.is-loading .spinner{display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.input,select{min-height:44px;border:1.5px solid var(--line-strong);border-radius:var(--radius-ctl);background:var(--surface);color:var(--ink);font:inherit;padding:0 14px;max-width:100%}
select{padding-right:10px;cursor:pointer}
.input{width:100%}
.input[aria-invalid="true"]{border-color:var(--danger);border-width:2px}
.input-short{max-width:10rem}
.field{display:grid;gap:6px}
.field>label{font-weight:700}
.opt{font-weight:400;color:var(--muted)}
.hint{font-size:.875rem;color:var(--muted);margin:0;line-height:1.45}
.hint-err{color:var(--danger);font-weight:700}
.err{display:flex;gap:6px;align-items:flex-start;font-size:.9rem;color:var(--danger);font-weight:700;margin:0;line-height:1.4}
.err .ic{width:18px;height:18px;margin-top:1px}
.check-row{display:flex;align-items:center;gap:10px;min-height:44px}
.check-row input{width:22px;height:22px;accent-color:var(--brand);margin:0;flex:none}

/* Master list */
.master-top{position:sticky;top:0;z-index:2;background:var(--surface);padding:16px 16px 12px;border-bottom:1px solid var(--line);display:grid;gap:12px}
.search{display:grid;gap:6px;position:relative}
.search label{font-weight:700;font-size:.9375rem;display:flex;justify-content:space-between;align-items:center}
.search-box{position:relative}
.search-box .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search-box .input{padding-left:40px}
.q-status{margin:0;font-size:.8125rem;color:var(--muted)}
.side-nav{padding-bottom:24px;position:relative}
.grp{margin:18px 16px 6px 22px;font-size:.75rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.items{list-style:none;margin:0;padding:0 8px}
.items:first-child{padding-top:8px}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:baseline;gap:2px 8px;padding:10px 12px 11px 14px;border-radius:var(--radius-sm);color:inherit;text-decoration:none;position:relative;min-height:44px}
.item:hover{background:var(--surface-2)}
.item[aria-current="page"]{background:var(--brand-soft)}
.item[aria-current="page"]::before{content:"";position:absolute;left:3px;top:10px;bottom:10px;width:4px;border-radius:4px;background:var(--brand)}
.item-title{font-weight:700;line-height:1.3}
.item-short{grid-column:1/-1;font-size:.875rem;color:var(--muted);line-height:1.4}
.item-badge{display:inline-flex;align-items:center;gap:3px;font-size:.75rem;font-weight:700;color:var(--success)}
.item-badge .ic{width:15px;height:15px;stroke-width:2.6}
.list-empty{padding:28px 20px;display:grid;justify-items:start;gap:8px}
.list-empty .ic{width:28px;height:28px;color:var(--muted)}
.le-title{font-weight:700;margin:0}

/* Lesson */
.lesson{max-width:48rem;margin:0 auto;padding:28px 28px 96px;container-type:inline-size}
@media (max-width:599px){.lesson{padding:16px 16px 96px}}
.eyebrow{font-size:.8125rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--brand);margin:0 0 8px}
.lesson h1{font:var(--display-wt) clamp(1.75rem,1.3rem + 1.8vw,2.375rem)/1.12 var(--font-display);letter-spacing:-.015em;margin:0 0 14px;text-wrap:balance}
.lesson h2{font:700 1.25rem/1.3 var(--font-display);margin:40px 0 12px;text-wrap:balance}
.rule{font-size:1.1875rem;line-height:1.55;margin:20px 0 0;max-width:62ch}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:24px;flex-wrap:wrap;position:relative}
.pager a{display:flex;flex-direction:column;gap:2px;padding:12px 16px;border:1.5px solid var(--line);border-radius:var(--radius-lg);text-decoration:none;color:inherit;flex:1 1 220px;min-width:0;font-weight:700}
.pager a:hover{border-color:var(--line-strong);background:var(--surface)}
.pager small{font-weight:400;color:var(--muted);font-size:.8125rem}
.pager .next{text-align:right}
.back{display:inline-flex;align-items:center;gap:4px;min-height:44px;padding:0 12px 0 6px;font-weight:700;text-decoration:none;border-radius:var(--radius-ctl);position:relative}
.back:hover{background:var(--surface-2)}

/* Start page */
.start-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:28px}
.start-grid.sisters{margin-top:12px}
.sis-ic{width:24px;height:24px;border-radius:6px;flex:none}
.tile{padding:16px 18px;border:1.5px solid var(--line);border-radius:var(--radius-lg);background:var(--surface);display:grid;gap:6px;align-content:start}
.tile h3{margin:0;font:700 1rem/1.3 var(--font-body);display:flex;gap:8px;align-items:center}
.tile p{margin:0;font-size:.9375rem;color:var(--muted)}
.tile .btn{justify-self:start;margin-top:6px}
.empty{display:grid;justify-items:start;gap:10px;padding-top:24px}
.empty>.ic{width:40px;height:40px;color:var(--muted)}

/* Toasts */
.toasts{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));pointer-events:none}
@media (min-width:800px){.toasts{align-items:flex-end;padding-right:24px}}
.toast{pointer-events:auto;position:relative;display:flex;align-items:center;gap:8px;width:min(100%,440px);padding:8px 6px 8px 14px;min-height:56px;background:var(--toast-bg);color:var(--toast-ink);border-radius:var(--radius-lg);box-shadow:var(--shadow);overflow:hidden;animation:toast-in .24s cubic-bezier(.2,.8,.2,1)}
.toast.leaving{animation:toast-out .16s ease-in forwards}
.toast-ic{display:grid;color:var(--toast-action)}
.toast-success .toast-ic{color:var(--toast-ok)}
.toast-error .toast-ic{color:var(--toast-err)}
.toast-msg{margin:0;flex:1;font-size:.9375rem;line-height:1.4;padding:6px 0}
.toast-action{background:transparent;border:0;color:var(--toast-action);font:inherit;font-weight:700;min-height:44px;padding:0 12px;border-radius:var(--radius-sm);cursor:pointer;flex:none}
.toast-action:hover,.toast .icon-btn:hover{background:color-mix(in srgb,var(--toast-ink) 12%,transparent)}
.toast .icon-btn{color:var(--toast-ink)}
.toast :focus-visible{outline-color:var(--toast-action)}
.toast-timer{position:absolute;left:0;bottom:0;height:3px;width:100%;background:var(--toast-action);transform-origin:left;animation:toast-timer linear forwards}
.toast:hover .toast-timer,.toast:focus-within .toast-timer{animation-play-state:paused}
@keyframes toast-in{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes toast-out{to{opacity:0;transform:translateY(8px)}}
@keyframes toast-timer{from{transform:scaleX(1)}to{transform:scaleX(0)}}

.chips{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.chips a{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 12px;border:1.5px solid var(--line-strong);border-radius:var(--radius-ctl);background:var(--surface);color:var(--ink);text-decoration:none;font-weight:700;font-size:.9375rem}
.chips a:hover{background:var(--surface-2)}
.chips a[aria-current="page"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.chips .ic{width:18px;height:18px}
.code{margin:0;padding:12px 14px;font:400 .8125rem/1.55 var(--font-mono);overflow-x:auto;white-space:pre;tab-size:2}
.code code{background:none;padding:0;font-size:inherit;overflow-wrap:normal}
.count{margin:16px 0 0;font-weight:700;color:var(--muted);min-height:1.5em}
.table{width:100%;border-collapse:collapse;font-size:.9375rem}
.table th,.table td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.table th{font-weight:700;white-space:nowrap}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius-lg)}
/* Seitenleiste im Stil einer Doku: Kapitel als Überschrift, Einträge darunter */
.grp{display:block;text-decoration:none}
a.grp:hover{color:var(--brand)}
a.grp[aria-current="page"]{color:var(--brand)}
.items .item{grid-template-columns:minmax(0,1fr);min-height:36px;padding:6px 12px 6px 14px}
.item code{background:none;padding:0;font-size:.875rem;font-weight:600}
.item.item-page{padding-top:10px;padding-bottom:11px}
@media (pointer:coarse){.items .item{min-height:44px;align-content:center}}
.hdr-link{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 12px;font-weight:700;text-decoration:none;border-radius:var(--radius-ctl)}
.hdr-link:hover{background:var(--surface-2)}
.hdr-link .ic{width:18px;height:18px}
@media (max-width:479px){.hdr-long,.hdr-link .ic{display:none}.appbar{flex-wrap:nowrap}}
.xlink::after{content:" ↗"}
a.logo{color:inherit;text-decoration:none;border-radius:var(--radius-sm);padding:2px 8px 2px 2px;margin-left:-2px}
a.logo:hover{background:var(--surface-2)}
.logo-name{display:block}
@media (max-width:479px){.logo-sub{display:none}}

/* ---------- Einträge ---------- */
:root{--tk-k:#8A2BB0;--tk-s:#1B6B40;--tk-n:#A3400B;--tk-c:#6B7280}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--tk-k:#D7A8F5;--tk-s:#7BD9A1;--tk-n:#FDBA74;--tk-c:#8B95A5}}
:root[data-theme="dark"]{--tk-k:#D7A8F5;--tk-s:#7BD9A1;--tk-n:#FDBA74;--tk-c:#8B95A5}
.ca-toc{margin-top:20px;position:relative}
.ca-entry{padding:28px 0 32px;border-bottom:1px solid var(--line);scroll-margin-top:16px;position:relative}
.ca-entry.ca-hit{border:2px solid var(--brand);border-radius:var(--radius-lg);padding:22px 16px 26px;margin:12px -16px 0;box-shadow:0 0 0 4px var(--brand-soft)}
.lesson .ca-entry h2{margin:0;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
.ca-entry h2 code{font-size:1.125rem}
.ca-sub{font:400 1rem/1.4 var(--font-body);color:var(--muted)}
.ca-desc{margin:8px 0 14px;max-width:68ch}
.ca-desc p{margin:0 0 8px}
.ca-desc p:last-child{margin-bottom:0}
.ca-vals{border:0;margin:0 0 12px;padding:0;display:flex;flex-wrap:wrap;gap:6px;min-width:0;position:relative}
.ca-vals label{position:relative;display:inline-flex;align-items:center;min-height:36px;padding:0 10px;border:1.5px solid var(--line-strong);border-radius:var(--radius-sm);background:var(--surface);cursor:pointer;font-size:.9375rem;font-weight:700}
.ca-vals label:hover{background:var(--surface-2)}
.ca-vals input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.ca-vals code{background:none;padding:0;font-size:.8125rem}
.ca-vals label:has(input:checked){background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.ca-vals label:has(input:focus-visible){outline:3px solid var(--focus);outline-offset:2px}
.ca-note{margin:10px 0 0;font-size:.9375rem;padding:8px 12px;border-left:4px solid var(--brand);background:var(--brand-soft);border-radius:0 var(--radius-sm) var(--radius-sm) 0;max-width:68ch}
.ca-codebox{border:1.5px solid var(--line);border-radius:var(--radius-lg);background:var(--surface);overflow:hidden;position:relative}
.ca-hl{background:var(--brand-soft);color:var(--brand);font-weight:700;border-radius:3px}
.ca-tip{margin:14px 0 0;padding:10px 14px;border-left:4px solid var(--warn);background:var(--warn-bg);border-radius:0 var(--radius-sm) var(--radius-sm) 0;font-size:.9375rem;max-width:68ch;position:relative}
.ca-rule{margin:10px 0 0;padding:10px 14px;border-left:4px solid var(--success);background:var(--success-bg);border-radius:0 var(--radius-sm) var(--radius-sm) 0;font-size:.9375rem;max-width:68ch}
.ca-links{margin:10px 0 0;font-size:.875rem;color:var(--muted)}
.ca-find{margin:8px 0 0;position:relative}
.ca-index td:first-child{font-weight:700}
.items .item{grid-template-columns:minmax(0,1fr);min-height:36px;padding:6px 12px 6px 14px}
.item .item-title{font-weight:600;font-size:.9375rem}
.btn-sm{min-height:36px;padding:0 12px;font-size:.9375rem}
.btn .ic{width:18px;height:18px}

/* Syntax-Farben */
.tk-k{color:var(--tk-k);font-weight:600}
.tk-s{color:var(--tk-s)}
.tk-n{color:var(--tk-n)}
.tk-c{color:var(--tk-c);font-style:italic}

/* ---------- run: echter Code, eigene Konsole ---------- */
.run-bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:8px 10px;border-top:1px solid var(--line);background:var(--surface-2)}
.run-hint{font-size:.8125rem;color:var(--muted)}
.console{margin-top:10px;border:1.5px solid var(--line);border-radius:var(--radius-lg);background:var(--surface);overflow:hidden}
.console-h{margin:0;padding:6px 12px;font-size:.75rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);background:var(--surface-2)}
.con-lines{list-style:none;margin:0;padding:6px 0;font:400 .8125rem/1.5 var(--font-mono);min-height:2.6em}
.con-lines:empty::before{content:attr(data-empty);display:block;padding:2px 12px;color:var(--muted);font-style:italic}
.con-lines li{display:flex;gap:10px;padding:2px 12px;border-bottom:1px solid color-mix(in srgb,var(--line) 55%,transparent);white-space:pre-wrap;overflow-wrap:anywhere}
.con-lines li:last-child{border-bottom:0}
.con-t{flex:none;min-width:5.5ch;text-align:right;color:var(--muted)}
.con-warn{background:var(--warn-bg);color:var(--warn)}
.con-error{background:var(--danger-bg);color:var(--danger)}

/* ---------- trace: Event Loop Schritt für Schritt ---------- */
.tr{display:grid;gap:12px}
@container (min-width:44rem){.tr{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);align-items:start}.tr-note,.tr-bar{grid-column:1/-1}}
.tr-code .code{padding:10px 0}
.tr-code .ln{display:block;padding:0 14px 0 0;border-left:4px solid transparent}
.tr-code .ln::before{content:attr(data-n);display:inline-block;width:3ch;margin-right:12px;text-align:right;color:var(--muted);opacity:.7}
.tr-code .ln.is-cur{background:var(--brand-soft);border-left-color:var(--brand)}
.tr-boxes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tr-box{border:1.5px solid var(--line);border-radius:var(--radius-sm);background:var(--surface);padding:6px 8px 8px;min-height:84px;min-width:0}
.tr-box h3{margin:0 0 6px;font:700 .75rem/1.3 var(--font-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tr-box ol,.tr-box ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.tr-stack ol{flex-direction:column-reverse}
.tr-box li{font:500 .8125rem/1.35 var(--font-mono);padding:4px 8px;border-radius:6px;background:var(--surface-2);overflow-wrap:anywhere}
.tr-box li.is-new{background:var(--brand);color:var(--brand-ink)}
.tr-out{grid-column:1/-1}
.tr-out ol{flex-direction:row;flex-wrap:wrap}
.tr-micro{border-color:color-mix(in srgb,var(--success) 45%,var(--line))}
.tr-task{border-color:color-mix(in srgb,var(--warn) 45%,var(--line))}
.tr-note{margin:0;padding:10px 14px;border-radius:var(--radius-sm);background:var(--surface-2);min-height:3.2em;max-width:none}
.tr-bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.tr-pos{font-size:.875rem;color:var(--muted);font-variant-numeric:tabular-nums;margin-right:auto;min-width:12ch}

/* ---------- sim: Regler rein, Ergebnis raus ---------- */
.sim-ctl{display:grid;gap:12px;margin-bottom:14px}
.sim-f{border:0;margin:0;padding:0;min-width:0}
.sim-f legend,.sim-lbl{font-weight:700;font-size:.9375rem;margin-bottom:6px;padding:0}
.sim-f .ca-vals{margin:0}
.sim-range{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:4px 12px}
.sim-range .sim-lbl{grid-column:1/-1;margin:0}
.sim-range input{width:100%;accent-color:var(--brand)}
.sim-range output{font:700 .875rem/1 var(--font-mono);min-width:8ch;text-align:right}
.sim-checks{display:flex;flex-wrap:wrap;gap:0 18px}
.sim-checks .check-row{min-height:36px}
.verdict{display:flex;gap:10px;align-items:flex-start;margin:0 0 12px;padding:10px 14px;border-radius:var(--radius-sm);font-weight:700;line-height:1.4}
.verdict .ic{margin-top:1px}
.v-ok{background:var(--success-bg);color:var(--success)}
.v-bad{background:var(--danger-bg);color:var(--danger)}
.v-warn{background:var(--warn-bg);color:var(--warn)}
.v-info{background:var(--brand-soft);color:var(--brand)}
.panes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:10px}
.pane{margin:0;border:1.5px solid var(--line);border-radius:var(--radius-lg);background:var(--surface);overflow:hidden;min-width:0}
.pane figcaption{padding:6px 12px;font-size:.75rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);background:var(--surface-2)}
.pane .code{white-space:pre-wrap;overflow-wrap:anywhere}
.flow{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:6px;counter-reset:fl}
.flow li{counter-increment:fl;display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;padding:8px 12px;border-radius:var(--radius-sm);background:var(--surface);border:1.5px solid var(--line);font-size:.9375rem}
.flow li::before{content:counter(fl);display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--surface-2);font:700 .75rem/1 var(--font-mono)}
.flow .fl-ok{border-color:color-mix(in srgb,var(--success) 50%,var(--line))}
.flow .fl-ok::before{background:var(--success);color:var(--surface)}
.flow .fl-bad{border-color:color-mix(in srgb,var(--danger) 50%,var(--line))}
.flow .fl-bad::before{background:var(--danger);color:var(--surface)}
.flow .fl-warn::before{background:var(--warn);color:var(--surface)}
.flow .fl-off{opacity:.55}
.sim-extra{margin-top:12px}

/* ---------- custom: freie Demos ---------- */
.stage{position:relative;padding:16px;border:1.5px dashed var(--line-strong);border-radius:var(--radius-lg);background:var(--surface)}
.stage+.console{margin-top:10px}
.stage-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.stage-row+.stage-row{margin-top:10px}
.meter{font:700 1.5rem/1.2 var(--font-mono);font-variant-numeric:tabular-nums}
.meter small{display:block;font:400 .8125rem/1.3 var(--font-body);color:var(--muted)}
.meters{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:12px}
.meters>div{padding:10px 12px;border-radius:var(--radius-sm);background:var(--surface-2)}
.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:4px 14px;margin:0;font-size:.9375rem}
.kv dt{font-weight:700}
.kv dd{margin:0;font-family:var(--font-mono);font-size:.8125rem;overflow-wrap:anywhere}

/* ---------- Wasserfall ---------- */
/* Wasserfall: eine Zeile pro Anfrage, farbige Phasen auf einer Zeitachse */
.wf{display:grid;gap:6px;font-size:.8125rem}
.wf-row{display:grid;grid-template-columns:minmax(64px,9rem) minmax(0,1fr) auto;gap:10px;align-items:center}
.wf-lbl{font-family:var(--font-mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wf-track{position:relative;height:18px;border-radius:4px;background:var(--surface-2)}
.wf-seg{position:absolute;top:0;bottom:0;min-width:2px}
.wf-seg:first-child{border-radius:4px 0 0 4px}
.wf-seg:last-child{border-radius:0 4px 4px 0}
.wf-t{font:600 .75rem/1 var(--font-mono);color:var(--muted);min-width:6ch;text-align:right}
.wf-legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin:10px 0 0;padding:0;list-style:none;font-size:.8125rem;color:var(--muted)}
.wf-legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.ph-dns{background:#0E9F8E}.ph-tcp{background:#E07B00}.ph-tls{background:#8B5CF6}.ph-wait{background:#64748B}.ph-ttfb{background:#16A34A}.ph-dl{background:#2563EB}.ph-parse{background:#C026D3}.ph-exec{background:#DB2777}.ph-render{background:#CA8A04}.ph-block{background:#DC2626}
.wf-total{margin:10px 0 0;font-weight:700}


/* ---------- HTTP-Atlas ---------- */
/* Tabellen in Simulationen */
.mini{width:100%;border-collapse:collapse;font-size:.875rem}
.mini th,.mini td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.mini th{font-weight:700;white-space:nowrap}
.mini .yes{color:var(--success);font-weight:700}
.mini .no{color:var(--danger);font-weight:700}
.mini tr.is-cur{background:var(--brand-soft)}

/* Chips für Beispiel-Eingaben */
.presets{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 0}
.presets button{min-height:32px;padding:0 10px;border-radius:999px;border:1.5px solid var(--line-strong);background:var(--surface);color:var(--ink);font:500 .8125rem/1 var(--font-mono);cursor:pointer}
.presets button:hover{background:var(--surface-2)}
.ha-out{margin-top:12px}
</style>

<script>
(function(){
'use strict';
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const reducedMotion=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
const isNarrow=()=>matchMedia('(max-width: 799px)').matches;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const store={
  get(k,d){try{const v=localStorage.getItem('http-atlas:'+k);return v===null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem('http-atlas:'+k,JSON.stringify(v))}catch(e){}}
};

/* ---------- Sprache ----------
   Die Sprache gilt für den ganzen Seitenaufruf, der Umschalter lädt neu. Darum darf tx() auch in Daten
   stehen, die beim Start einmal ausgewertet werden. Reihenfolge: ?lang=, gespeicherte Wahl, Browsersprache. */
const LANG=(()=>{
  const q=new URLSearchParams(location.search).get('lang');
  if(q==='de'||q==='en'){store.set('lang',q);return q}
  const s=store.get('lang',null);
  return s==='de'||s==='en'?s:/^de\b/i.test(navigator.language||'')?'de':'en';
})();
const tx=(de,en)=>LANG==='en'?en:de;
const LOCALE=tx('de-AT','en-US');
document.documentElement.lang=LANG;
const langHref=l=>{const u=new URL(location.href);u.searchParams.set('lang',l);return u.href};
/* Hell/Dunkel-Umschalter: Klick legt das Design fest und merkt es sich, sonst gilt die Systemeinstellung */
(()=>{
  const btn=$('#theme-btn'),mq=matchMedia('(prefers-color-scheme: dark)');
  const isDark=()=>{const t=document.documentElement.getAttribute('data-theme');return t?t==='dark':mq.matches};
  const sync=()=>btn.setAttribute('aria-pressed',String(isDark()));
  btn.addEventListener('click',()=>{const m=isDark()?'light':'dark';document.documentElement.setAttribute('data-theme',m);store.set('theme',m);window.dispatchEvent(new Event('themechange'));sync()});
  mq.addEventListener('change',sync);window.addEventListener('themechange',sync);sync();
})();
/* Breite-Umschalter: Lektion normal (48rem) oder über die ganze Spalte, wird gemerkt */
(()=>{
  const btn=$('#width-btn'),root=document.documentElement;
  const sync=()=>btn.setAttribute('aria-pressed',String(root.getAttribute('data-width')==='wide'));
  btn.addEventListener('click',()=>{
    const wide=root.getAttribute('data-width')!=='wide';
    if(wide)root.setAttribute('data-width','wide');else root.removeAttribute('data-width');
    store.set('width',wide?'wide':'normal');sync();
  });
  sync();
})();
/* Breite ziehen: Griff am rechten Rand der Lektion, nur in der breiten Ansicht. Die Lektion ist
   zentriert, darum wächst sie beim Ziehen nach beiden Seiten – Breite = 2 × Abstand zur Mitte. */
(()=>{
  const root=document.documentElement,view=$('#view');
  const lesson=()=>$('.lesson',view);
  const min=()=>parseFloat(getComputedStyle(root).fontSize)*48;
  const max=()=>view.clientWidth;
  const clamp=w=>Math.min(max(),Math.max(min(),w));
  const set=w=>{if(w==null)root.style.removeProperty('--lesson-w');else root.style.setProperty('--lesson-w',Math.round(w)+'px')};
  const aria=()=>{const g=$('.lesson-grip',view),L=lesson();if(!g||!L)return;
    g.setAttribute('aria-valuemin',Math.round(min()));g.setAttribute('aria-valuemax',Math.round(max()));g.setAttribute('aria-valuenow',Math.round(L.getBoundingClientRect().width))};
  // An den Rand gezogen heißt „ganze Breite“ – dann wächst die Lektion auch mit dem Fenster mit
  const commit=w=>{const full=w>=max()-1;set(full?null:w);store.set('lessonW',full?null:Math.round(w));aria()};
  function attach(){
    const L=lesson();if(!L||$('.lesson-grip',L))return;
    const g=document.createElement('div');
    g.className='lesson-grip';g.tabIndex=0;g.setAttribute('role','separator');g.setAttribute('aria-orientation','vertical');
    g.setAttribute('aria-label',tx('Breite der Lektion','Lesson width'));
    g.title=tx('Ziehen ändert die Breite · Doppelklick: ganze Breite','Drag to resize · double-click: full width');
    g.innerHTML='<span></span>';L.append(g);aria();
  }
  view.addEventListener('pointerdown',e=>{
    const g=e.target.closest('.lesson-grip');if(!g||e.button!==0)return;
    e.preventDefault();
    const r=lesson().getBoundingClientRect(),cx=r.left+r.width/2;
    g.setPointerCapture(e.pointerId);g.classList.add('is-dragging');root.classList.add('is-resizing');
    const move=ev=>set(clamp(2*(ev.clientX-cx)));
    const up=()=>{g.removeEventListener('pointermove',move);g.classList.remove('is-dragging');root.classList.remove('is-resizing');commit(lesson().getBoundingClientRect().width)};
    g.addEventListener('pointermove',move);g.addEventListener('lostpointercapture',up,{once:true});
  });
  view.addEventListener('dblclick',e=>{if(e.target.closest('.lesson-grip'))commit(max())});
  view.addEventListener('keydown',e=>{
    if(!e.target.classList.contains('lesson-grip'))return;
    const w=lesson().getBoundingClientRect().width,step=e.shiftKey?160:40;
    const next={ArrowLeft:w-step,ArrowRight:w+step,Home:min(),End:max()}[e.key];
    if(next!=null){e.preventDefault();e.stopPropagation();commit(clamp(next))}
  });
  view.addEventListener('focusin',e=>{if(e.target.classList.contains('lesson-grip'))aria()});
  new MutationObserver(attach).observe(view,{childList:true});attach();
})();
/* Statische Texte der Hülle: data-en ersetzt den Text, data-en-label das aria-label */
if(LANG==='en')$$('[data-en],[data-en-label]').forEach(el=>{
  if(el.dataset.en)el.textContent=el.dataset.en;
  if(el.dataset.enLabel)el.setAttribute('aria-label',el.dataset.enLabel);
});
/* Links zu den Schwester-Apps tragen die Sprache mit */
const withLang=root=>$$('a[href^="https://daniel-hopium.github.io/"]',root).forEach(a=>{const u=new URL(a.href);u.searchParams.set('lang',LANG);a.href=u.href});

const P={
  check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  ok:'<circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/>',
  xc:'<circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/>',
  x:'<path d="M6 6l12 12M18 6L6 18"/>',
  back:'<path d="M15 5l-7 7 7 7"/>',
  fwd:'<path d="M9 5l7 7-7 7"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  search:'<circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/>',
  trash:'<path d="M4 7h16M9.5 7V4.5h5V7M6.5 7l1 13h9l1-13"/>',
  info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.6v.2"/>',
  alert:'<path d="M12 3.5l9.5 16.5h-19z"/><path d="M12 10v4.5M12 17.3v.2"/>',
  copy:'<rect x="8.5" y="8.5" width="11.5" height="11.5" rx="2"/><path d="M15.5 8.5V5a1 1 0 00-1-1H5a1 1 0 00-1 1v9.5a1 1 0 001 1h3.5"/>',
  home:'<path d="M4 11l8-7 8 7v9h-5.5v-6h-5v6H4z"/>',

/* ---------- Toasts ---------- */
const toastBox=$('#toasts');
let activeUndo=null;
function announce(text,assertive){
  const r=$(assertive?'#live-assert':'#live-polite');
  r.textContent='';
  setTimeout(()=>{r.textContent=text},60);
}
function toast({msg,type='info',action,duration}){
  duration=duration??(action?8000:5000);
  const t=document.createElement('div');
  t.className='toast toast-'+type;
  t.innerHTML=`<span class="toast-ic">${ic(type==='success'?'ok':type==='error'?'alert':'info')}</span><p class="toast-msg"></p>`;
  $('.toast-msg',t).textContent=msg;
  let actionBtn=null;
  if(action){
    actionBtn=document.createElement('button');
    actionBtn.type='button';actionBtn.className='toast-action';actionBtn.textContent=action.label;
    t.append(actionBtn);
  }
  const closeBtn=document.createElement('button');
  closeBtn.type='button';closeBtn.className='icon-btn';closeBtn.setAttribute('aria-label',tx('Meldung schließen','Close message'));closeBtn.innerHTML=ic('x');
  t.append(closeBtn);
  const timer=document.createElement('span');
  timer.className='toast-timer';timer.style.animationDuration=duration+'ms';
  t.append(timer);
  toastBox.append(t);
  while(toastBox.children.length>3) toastBox.firstElementChild.remove();

  let remaining=duration,start=Date.now(),id=setTimeout(close,remaining),closed=false;
  function pause(){clearTimeout(id);remaining-=Date.now()-start}
  function resume(){start=Date.now();clearTimeout(id);id=setTimeout(close,Math.max(remaining,1200))}
  function close(){
    if(closed)return;closed=true;clearTimeout(id);
    if(activeUndo&&activeUndo.toast===t) activeUndo=null;
    const hadFocus=t.contains(document.activeElement);
    const done=()=>{t.remove();if(hadFocus) focusMainHeading()};
    if(reducedMotion()) done(); else {t.classList.add('leaving');setTimeout(done,170)}
  }
  t.addEventListener('mouseenter',pause);
  t.addEventListener('mouseleave',()=>{if(!t.contains(document.activeElement))resume()});
  t.addEventListener('focusin',pause);
  t.addEventListener('focusout',e=>{if(!t.contains(e.relatedTarget)&&!t.matches(':hover'))resume()});
  closeBtn.addEventListener('click',close);
  if(action){
    const run=()=>{action.fn();close()};
    actionBtn.addEventListener('click',run);
    activeUndo={toast:t,run};
  }
  announce(msg+(action?` ${action.label} ${tx('mit Strg plus Z','with Ctrl plus Z')}.`:''),type==='error');
  return close;
}
function focusMainHeading(){const h=$('#lesson-title');if(h)h.focus({preventScroll:true})}

const PSL=['github.io','co.uk','org.uk','com.au','co.at','or.at','gv.at','vercel.app','netlify.app','pages.dev','herokuapp.com','web.app','firebaseapp.com','azurewebsites.net'];
function siteOf(host){
  if(/^[\d.]+$/.test(host)||host==='localhost'||!host.includes('.'))return host;
  const p=host.split('.'),suffix=PSL.find(s=>host===s||host.endsWith('.'+s));
  const n=suffix?suffix.split('.').length+1:2;
  return p.slice(-n).join('.');
}
