   flow:[['info',`<b>${tx('Browser','Browser')}:</b> ${browser}`]]};
 },
 tip:tx('fetch wirft nur bei Netzwerkfehlern (offline, DNS, CORS). Ein 404 oder 500 ist für fetch eine erfolgreiche Antwort – darum immer <code>if (!res.ok)</code> prüfen.','fetch only throws on network errors (offline, DNS, CORS). A 404 or 500 is a successful response as far as fetch is concerned – so always check <code>if (!res.ok)</code>.'),
 links:[mdn('Status')]},

{id:'redirects',cat:'anatomy',title:'Redirects',sub:tx('301, 302, 303, 307, 308 im Vergleich','301, 302, 303, 307, 308 compared'),kind:'sim',keys:'redirect 301 302 303 307 308 location post get',
 desc:tx('<p>Fünf Codes leiten weiter. Sie unterscheiden sich in zwei Fragen: Bleibt die Methode erhalten? Merkt sich der Browser die Weiterleitung?</p>','<p>Five codes redirect. They differ on two questions: is the method kept? Does the browser remember the redirect?</p>'),
 ctl:[{k:'c',type:'radio',label:'Status',def:'302',opts:['301','302','303','307','308'].map(x=>[x,x])},{k:'m',type:'radio',label:tx('Ursprüngliche Methode','Original method'),def:'POST',opts:[['GET','GET'],['POST','POST']]}],
 run({c,m}){
  const keep=c==='307'||c==='308',perm=c==='301'||c==='308',m2=keep?m:'GET',lost=m==='POST'&&!keep;
  const T={301:'Moved Permanently',302:'Found',303:'See Other',307:'Temporary Redirect',308:'Permanent Redirect'}[c];
  return {v:lost?'warn':'ok',
   verdict:lost?tx(`Aus POST wird GET – der Body geht verloren. ${c==='303'?'Bei 303 ist das gewollt: „Schau dir das Ergebnis an“.':'Bei 301/302 ist das ein historischer Fehler der Browser, den die Spezifikation inzwischen erlaubt.'}`,`POST turns into GET – the body is lost. ${c==='303'?'With 303 that’s intended: “go look at the result”.':'With 301/302 it’s a historical browser bug the spec now permits.'}`):tx(`Die Methode ${m} bleibt erhalten${m==='POST'?', der Body wird erneut gesendet':''}.`,`The method ${m} is kept${m==='POST'?', the body is sent again':''}.`),
   panes:[{t:'1. Request',code:msg([`${m} /api/orders HTTP/1.1`,'Host: shop.example.com',m==='POST'?'':null,m==='POST'?'{ "item": 7 }':null])},{t:'1. Response',code:msg([`HTTP/1.1 ⟦${c} ${T}⟧`,'Location: /api/v2/orders',perm?'⟦Cache-Control: max-age=31536000⟧':null])},{t:'2. Request',code:msg([`⟦${m2}⟧ /api/v2/orders HTTP/1.1`,'Host: shop.example.com',m2==='POST'?'':null,m2==='POST'?'{ "item": 7 }':null])}],
   flow:[[perm?'warn':'info',perm?tx('Dauerhaft: Der Browser merkt sich die Weiterleitung und fragt beim nächsten Mal gar nicht mehr nach. Ein Fehler hier ist schwer zurückzunehmen.','Permanent: the browser remembers the redirect and won’t even ask next time. A mistake here is hard to undo.'):tx('Vorübergehend: Beim nächsten Mal fragt der Browser wieder die alte Adresse.','Temporary: next time the browser asks the old address again.')],
    ['info',tx('Das klassische Muster nach einem Formular: POST → 303 → GET der Ergebnisseite. Dann legt „Neu laden“ keine zweite Bestellung an (Post/Redirect/Get).','The classic pattern after a form: POST → 303 → GET of the result page. Then “reload” doesn’t create a second order (Post/Redirect/Get).')]]};
 },
 rule:tx('Für APIs 307/308 nehmen, für „Formular abgeschickt, jetzt Ergebnis zeigen“ 303.','For APIs use 307/308, for “form submitted, now show the result” use 303.'),
 links:[mdn('Redirections')]},

{id:'negotiation',cat:'anatomy',title:'Content Negotiation',sub:tx('Sprache, Format, Kompression','Language, format, compression'),kind:'sim',keys:'accept accept-language accept-encoding vary gzip brotli content negotiation',
 desc:tx('<p>Der Browser sagt mit <code>Accept</code>-Headern, was er mag. Der Server wählt aus und sagt mit <code>Vary</code>, wovon die Antwort abhing – sonst liefert ein Cache dem Nächsten die falsche Sprache.</p>','<p>The browser states what it likes with <code>Accept</code> headers. The server picks and says with <code>Vary</code> what the response depended on – otherwise a cache serves the next person the wrong language.</p>'),
 ctl:[{k:'lang',type:'select',label:'Accept-Language',def:'de-AT,de;q=0.9,en;q=0.8',opts:[['de-AT,de;q=0.9,en;q=0.8','de-AT,de;q=0.9,en;q=0.8'],['en-US,en;q=0.9','en-US,en;q=0.9'],['fr-FR,fr;q=0.9','fr-FR,fr;q=0.9']]},
  {k:'acc',type:'radio',label:'Accept',def:'text/html',opts:[['text/html','text/html'],['application/json','application/json']]},
  {k:'enc',type:'checks',label:'Accept-Encoding',opts:[['br','br (Brotli)',true],['gzip','gzip',true]]}],
 run({lang,acc,enc}){
  const l=lang.startsWith('de')?'de':lang.startsWith('en')?'en':null,ce=enc.br?'br':enc.gzip?'gzip':null,size={br:22,gzip:28}[ce]||100;
  const ae=Object.keys(enc).filter(k=>enc[k]).join(', ');
  return {v:l?'ok':'warn',
   verdict:l?tx(`Der Server liefert ${acc==='application/json'?'JSON':'HTML'} auf ${l==='de'?'Deutsch':'Englisch'}, ${ce?`komprimiert mit ${ce}: ${size} KB statt 100 KB.`:'unkomprimiert: 100 KB.'}`,`The server delivers ${acc==='application/json'?'JSON':'HTML'} in ${l==='de'?'German':'English'}, ${ce?`compressed with ${ce}: ${size} KB instead of 100 KB.`:'uncompressed: 100 KB.'}`):tx('Französisch gibt es nicht – der Server fällt auf seine Standardsprache Englisch zurück.','There’s no French – the server falls back to its default, English.'),
   panes:[{t:'Request',code:msg(['GET /artikel/42 HTTP/1.1','Host: news.example.com',`⟦Accept: ${acc}⟧`,`⟦Accept-Language: ${lang}⟧`,ae?`⟦Accept-Encoding: ${ae}⟧`:null])},
    {t:'Response',code:msg(['HTTP/1.1 200 OK',`Content-Type: ${acc}; charset=utf-8`,`⟦Content-Language: ${l||'en'}⟧`,ce?`⟦Content-Encoding: ${ce}⟧`:null,`Content-Length: ${size*1024}`,'⟦Vary: Accept, Accept-Language, Accept-Encoding⟧'])}]};
 },
 tip:tx('Fehlt <code>Vary</code>, speichert ein CDN die erste Antwort und liefert sie allen – auch die deutsche Seite an englische Besucher.','Without <code>Vary</code> a CDN stores the first response and serves it to everyone – including the German page to English visitors.'),
 links:[mdn('Content_negotiation')]},

/* ---------- Caching ---------- */
{id:'cachecontrol',cat:'caching',title:'Cache-Control',sub:tx('Frisch, veraltet, nachfragen','Fresh, stale, revalidate'),kind:'sim',keys:'cache-control max-age no-cache no-store immutable fresh stale reload',
 desc:tx('<p>Eine Datei wurde schon einmal geladen. Jetzt wird sie wieder gebraucht. Was passiert – je nach <code>Cache-Control</code>, Alter und Art des Ladens?</p>','<p>A file was loaded once before. Now it’s needed again. What happens – depending on <code>Cache-Control</code>, age and how it is loaded?</p>'),
 ctl:[{k:'cc',type:'select',label:tx('Cache-Control der ersten Antwort','Cache-Control of the first response'),def:'max-age=600',opts:[['','(kein Header)'],['no-store','no-store'],['no-cache','no-cache'],['max-age=600','max-age=600'],['max-age=31536000, immutable','max-age=31536000, immutable']].map(([v,l])=>[v,v?l:tx('(kein Header)','(no header)')])},
  {k:'age',type:'range',label:tx('Zeit seit dem ersten Laden','Time since first load'),min:0,max:60,def:5,fmt:v=>v+' min'},
  {k:'how',type:'radio',label:tx('Wie wird geladen?','How is it loaded?'),def:'nav',opts:[['nav',tx('Link geklickt','Link clicked')],['reload',tx('Neu laden (F5)','Reload (F5)')],['hard',tx('Hart neu laden (Strg+F5)','Hard reload (Ctrl+F5)')]]}],
 run({cc,age,how}){
  const maxAge=cc.includes('max-age=600')?10:cc.includes('31536000')?525600:cc===''?24*60:0;
  const fresh=age<maxAge,imm=cc.includes('immutable');
  let mode;
  if(how==='hard'||cc==='no-store')mode='full';
  else if(cc==='no-cache')mode='reval';
  else if(how==='reload')mode=imm?'cache':'reval';
  else mode=fresh?'cache':'reval';
  const first=['HTTP/1.1 200 OK','Content-Type: text/css',cc?`⟦Cache-Control: ${cc}⟧`:null,'ETag: "v7-9f3a"','Last-Modified: '+tx('vor 10 Tagen','10 days ago')];
  const V={cache:['ok',tx('Aus dem Cache, ohne Anfrage: 0 ms, 0 Bytes übers Netz.','From the cache, no request: 0 ms, 0 bytes over the network.')],reval:['info',tx('Der Browser fragt nach („hat sich was geändert?“). Antwort 304: nur Header, ein Roundtrip.','The browser asks (“has anything changed?”). Response 304: headers only, one round trip.')],full:['warn',tx('Volle Anfrage, die ganze Datei kommt neu.','Full request, the whole file comes again.')]}[mode];
  const reasons={cache:fresh&&!imm?tx(`Die Antwort ist ${age} min alt und noch ${maxAge>=525600?'ein Jahr':maxAge+' min'} frisch.`,`The response is ${age} min old and fresh for ${maxAge>=525600?'a year':maxAge+' min'}.`)+(cc===''?tx(' Ohne Header schätzt der Browser die Frische: 10 % der Zeit seit Last-Modified, hier ein Tag.',' Without a header the browser guesses freshness: 10% of the time since Last-Modified, here one day.'):''):tx('immutable: Die Datei ändert sich nie, also fragt der Browser nicht einmal beim Neuladen nach.','immutable: the file never changes, so the browser doesn’t even ask on reload.'),
   reval:cc==='no-cache'?tx('no-cache heißt nicht „nicht cachen“, sondern „vor jeder Nutzung nachfragen“.','no-cache doesn’t mean “don’t cache” but “check before every use”.'):how==='reload'?tx('Neu laden fragt bei frischen Dateien trotzdem nach.','Reload asks again even for fresh files.'):tx(`Die Antwort ist ${age} min alt, frisch war sie nur ${maxAge} min. Sie ist veraltet (stale).`,`The response is ${age} min old but was only fresh for ${maxAge} min. It’s stale.`),
   full:cc==='no-store'?tx('no-store: Der Browser hat gar nichts gespeichert.','no-store: the browser stored nothing at all.'):tx('Hartes Neuladen umgeht den Cache bewusst.','A hard reload bypasses the cache on purpose.')}[mode];
  return {v:V[0],verdict:V[1],
   panes:[{t:tx('Erste Antwort (gespeichert)','First response (stored)'),code:msg(first)},
    {t:tx('Jetzt: Request','Now: request'),code:mode==='cache'?esc(tx('(keine Anfrage – aus dem Cache)','(no request – from the cache)')):msg(['GET /app.css HTTP/1.1',mode==='reval'?'⟦If-None-Match: "v7-9f3a"⟧':null,mode==='full'&&how==='hard'?'⟦Cache-Control: no-cache⟧':null])},
    {t:tx('Jetzt: Response','Now: response'),code:mode==='cache'?esc(tx('(aus dem Cache)','(from the cache)')):mode==='reval'?msg(['HTTP/1.1 ⟦304 Not Modified⟧','ETag: "v7-9f3a"']):msg(['HTTP/1.1 200 OK',cc?`Cache-Control: ${cc}`:null,'Content-Length: 48213','','…'])}],
   flow:[['info',reasons]]};
 },
 links:[mdn('Headers/Cache-Control')]},

{id:'etag',cat:'caching',title:tx('ETag und 304','ETag and 304'),sub:tx('Nachfragen statt neu laden','Asking instead of reloading'),kind:'sim',keys:'etag if-none-match last-modified if-modified-since 304 revalidation conditional',
 desc:tx('<p>Ist die Kopie veraltet, fragt der Browser mit einem <i>Validator</i> nach. Hat sich nichts geändert, antwortet der Server mit 304 und ohne Body.</p>','<p>When the copy is stale, the browser asks with a <i>validator</i>. If nothing changed, the server replies with 304 and no body.</p>'),
 ctl:[{k:'val',type:'radio',label:tx('Validator vom Server','Validator from the server'),def:'etag',opts:[['etag','ETag'],['lm','Last-Modified'],['none',tx('keiner','none')]]},{k:'x',type:'checks',label:tx('Auf dem Server','On the server'),opts:[['changed',tx('Datei wurde inzwischen geändert','File has changed since')]]}],
 run({val,x}){
  const cond=val==='etag'?'⟦If-None-Match: "v7-9f3a"⟧':val==='lm'?'⟦If-Modified-Since: Mon, 03 Nov 2026 09:00:00 GMT⟧':null,n304=val!=='none'&&!x.changed;
  return {v:n304?'ok':val==='none'?'warn':'info',
   verdict:val==='none'?tx('Ohne Validator kann der Browser nicht nachfragen – die ganze Datei (480 KB) kommt neu.','Without a validator the browser can’t ask – the whole file (480 KB) comes again.'):n304?tx('304 Not Modified: nur etwa 200 Bytes Header statt 480 KB. Der Browser nimmt seine Kopie und hält sie wieder für frisch.','304 Not Modified: only about 200 bytes of headers instead of 480 KB. The browser keeps its copy and treats it as fresh again.'):tx('Geändert: 200 mit der neuen Datei und einem neuen ETag.','Changed: 200 with the new file and a new ETag.'),
   panes:[{t:tx('Gespeicherte Antwort','Stored response'),code:msg(['HTTP/1.1 200 OK','Cache-Control: max-age=0',val==='etag'?'⟦ETag: "v7-9f3a"⟧':null,val==='lm'?'⟦Last-Modified: Mon, 03 Nov 2026 09:00:00 GMT⟧':null])},
    {t:'Request',code:msg(['GET /bundle.js HTTP/1.1','Host: app.example.com',cond])},
    {t:'Response',code:n304?msg(['HTTP/1.1 ⟦304 Not Modified⟧',val==='etag'?'ETag: "v7-9f3a"':null]):msg(['HTTP/1.1 200 OK',val==='etag'?'⟦ETag: "v8-c41d"⟧':null,'Content-Length: 491520','','…'])}]};
 },
 rule:tx('ETag schlägt Last-Modified: Er erkennt auch Änderungen innerhalb derselben Sekunde und funktioniert auf mehreren Servern gleich.','ETag beats Last-Modified: it catches changes within the same second and works the same across several servers.'),
 links:[mdn('Headers/ETag')]},

{id:'busting',cat:'caching',title:'Cache-Busting',sub:tx('Warum Dateinamen Hashes tragen','Why file names carry hashes'),kind:'sim',keys:'cache busting hash filename immutable deploy angular build',
 desc:tx('<p>Du deployst eine neue Version. Ein Besucher war gestern schon da. Bekommt er das neue JavaScript?</p>','<p>You deploy a new version. A visitor was here yesterday. Do they get the new JavaScript?</p>'),
 ctl:[{k:'s',type:'radio',label:tx('Strategie','Strategy'),def:'plain',opts:[['plain',tx('app.js, max-age 1 Jahr','app.js, max-age 1 year')],['nocache',tx('app.js, no-cache','app.js, no-cache')],['hash',tx('app.3f9a1c.js, immutable','app.3f9a1c.js, immutable')]]}],
 run({s}){
  const R={
   plain:['bad',tx('Er bekommt das alte JavaScript – bis zu ein Jahr lang. Der Browser fragt gar nicht nach, die Datei ist ja „frisch“.','They get the old JavaScript – for up to a year. The browser doesn’t even ask; the file is “fresh”.'),[['ok',tx('index.html lädt (no-cache, fragt nach): neue Version','index.html loads (no-cache, revalidated): new version')],['bad',tx('app.js kommt aus dem Cache: alte Version','app.js comes from the cache: old version')],['bad',tx('Neues HTML trifft altes JS – Fehler im Browser','New HTML meets old JS – errors in the browser')]]],
   nocache:['warn',tx('Richtig, aber langsam: Jede Datei kostet bei jedem Besuch einen Roundtrip zum Nachfragen.','Correct but slow: every file costs a round trip to revalidate on every visit.'),[['ok',tx('index.html: nachgefragt, neu','index.html: revalidated, new')],['ok',tx('app.js: nachgefragt, 200 mit neuer Version','app.js: revalidated, 200 with new version')],['warn',tx('Bei 40 Dateien: 40 Nachfragen, auch wenn sich nichts geändert hat','With 40 files: 40 revalidations, even when nothing changed')]]],
   hash:['ok',tx('Er bekommt sofort die neue Version – und für unveränderte Dateien geht gar keine Anfrage raus.','They get the new version right away – and for unchanged files no request goes out at all.'),[['ok',tx('index.html (no-cache) nennt jetzt app.7b2e90.js','index.html (no-cache) now references app.7b2e90.js')],['ok',tx('Neuer Name, also nicht im Cache: wird geladen','New name, so not in the cache: gets loaded')],['ok',tx('Unveränderte Dateien behalten ihren Hash: 0 Anfragen','Unchanged files keep their hash: 0 requests')]]]
  }[s];
  return {v:R[0],verdict:R[1],flow:R[2],
   panes:[{t:'index.html',code:msg(['Cache-Control: no-cache','',`<script src="${s==='hash'?'⟦app.7b2e90.js⟧':'app.js'}"><\/script>`])},{t:s==='hash'?'app.7b2e90.js':'app.js',code:msg([`⟦Cache-Control: ${s==='nocache'?'no-cache':s==='hash'?'max-age=31536000, immutable':'max-age=31536000'}⟧`])}]};
 },
 rule:tx('HTML immer <code>no-cache</code>, alles mit Hash im Namen <code>max-age=31536000, immutable</code>. Angular, Vite und Co. erzeugen die Hashes beim Build automatisch.','HTML always <code>no-cache</code>, everything with a hash in its name <code>max-age=31536000, immutable</code>. Angular, Vite and friends add the hashes at build time.'),
 links:[['https://web.dev/articles/http-cache','web.dev: HTTP cache']]},

/* ---------- Cookies ---------- */
{id:'cookieattrs',cat:'cookies',title:tx('Cookie-Attribute','Cookie attributes'),sub:'SameSite, Secure, HttpOnly',kind:'sim',keys:'cookie samesite strict lax none secure httponly third party csrf',
 desc:tx('<p>Ein Cookie wird auf <code>shop.example</code> gesetzt. Wird es mitgeschickt – oder kann JavaScript es lesen? Das hängt von den Attributen und davon ab, woher die Anfrage kommt.</p>','<p>A cookie is set on <code>shop.example</code>. Is it sent along – or can JavaScript read it? That depends on its attributes and on where the request comes from.</p>'),
 ctl:[{k:'ss',type:'radio',label:'SameSite',def:'Lax',opts:[['','(—)'],['Strict','Strict'],['Lax','Lax'],['None','None']].map(([v,l])=>[v,v?l:tx('(nicht gesetzt)','(not set)')])},
  {k:'a',type:'checks',label:tx('Weitere Attribute','More attributes'),opts:[['secure','Secure',true],['httponly','HttpOnly',true]]},
  {k:'sc',type:'select',label:tx('Situation','Situation'),def:'nav',opts:[['same',tx('fetch auf shop.example selbst','fetch on shop.example itself')],['nav',tx('Link von blog.other klickt auf shop.example','Link on blog.other clicked to shop.example')],['post',tx('Formular auf evil.other sendet POST an shop.example','Form on evil.other POSTs to shop.example')],['xfetch',tx('fetch von evil.other mit credentials: "include"','fetch from evil.other with credentials: "include"')],['iframe',tx('shop.example im iframe auf blog.other','shop.example in an iframe on blog.other')],['http',tx('Seite über http:// statt https://','Page over http:// instead of https://')],['js',tx('document.cookie auf shop.example','document.cookie on shop.example')]]}],
 run({ss,a,sc}){
  const eff=ss||'Lax',set=`Set-Cookie: session=abc123; Path=/${ss?`; ⟦SameSite=${ss}⟧`:''}${a.secure?'; ⟦Secure⟧':''}${a.httponly?'; ⟦HttpOnly⟧':''}`;
  if(ss==='None'&&!a.secure)return {v:'bad',verdict:tx('Der Browser lehnt das Cookie ab: SameSite=None geht nur zusammen mit Secure.','The browser rejects the cookie: SameSite=None only works together with Secure.'),panes:[{t:'Response',code:msg(['HTTP/1.1 200 OK',set])}]};
  let sent,why,warn=null;
  if(sc==='js'){sent=!a.httponly;why=a.httponly?tx('HttpOnly: Für JavaScript unsichtbar. Ein XSS-Angriff kann die Session nicht auslesen.','HttpOnly: invisible to JavaScript. An XSS attack can’t read the session.'):tx('Ohne HttpOnly sieht jedes Skript auf der Seite das Cookie – auch eingeschleustes.','Without HttpOnly every script on the page sees the cookie – injected ones too.')}
  else if(sc==='http'){sent=!a.secure;why=a.secure?tx('Secure: nur über HTTPS. Über http:// bleibt es zu Hause.','Secure: HTTPS only. Over http:// it stays home.'):tx('Ohne Secure geht das Cookie im Klartext übers Netz – jeder im selben WLAN kann es mitlesen.','Without Secure the cookie travels in plain text – anyone on the same Wi-Fi can read it.')}
  else if(sc==='same'){sent=true;why=tx('Gleiche Website: Cookies gehen immer mit.','Same site: cookies are always sent.')}
  else if(sc==='nav'){sent=eff!=='Strict';why=eff==='Strict'?tx('Strict: Auch ein normaler Link von einer anderen Website kommt ohne Cookie an – der Nutzer wirkt ausgeloggt.','Strict: even a normal link from another site arrives without the cookie – the user appears logged out.'):tx('Ein Klick auf einen Link ist eine Top-Level-Navigation mit GET – Lax erlaubt das.','Clicking a link is a top-level navigation with GET – Lax allows it.')}
  else if(sc==='post'){sent=eff==='None';why=eff==='None'?tx('Mit None geht das Cookie mit – genau das ist ein CSRF-Angriff: Die fremde Seite handelt in deinem Namen.','With None the cookie goes along – that’s exactly a CSRF attack: the foreign site acts in your name.'):tx('Lax und Strict blockieren POST von fremden Seiten. Das ist der eingebaute CSRF-Schutz.','Lax and Strict block POST from foreign sites. That’s the built-in CSRF protection.')}
  else {sent=eff==='None';why=eff==='None'?tx('None erlaubt Cookies in fremden Kontexten.','None allows cookies in foreign contexts.'):tx(`Eingebettete Anfragen von fremden Seiten bekommen bei ${eff} keine Cookies.`,`Embedded requests from foreign sites get no cookies with ${eff}.`);if(sent)warn=tx('Aber: Safari und Firefox blockieren solche Drittanbieter-Cookies ohnehin weitgehend. Darauf bauen ist riskant.','But: Safari and Firefox largely block such third-party cookies anyway. Relying on it is risky.')}
  const reqLine={same:'GET /api/cart HTTP/1.1',nav:'GET /produkt/7 HTTP/1.1',post:'POST /konto/ueberweisen HTTP/1.1',xfetch:'GET /api/me HTTP/1.1',iframe:'GET /widget HTTP/1.1',http:'GET / HTTP/1.1'}[sc];
  const origin={nav:'Referer: https://blog.other/',post:'Origin: https://evil.other',xfetch:'Origin: https://evil.other',iframe:'Referer: https://blog.other/'}[sc];
  return {v:sent?(sc==='post'||sc==='xfetch'?'bad':'ok'):(sc==='nav'?'warn':'ok'),
   verdict:sc==='js'?(sent?tx('document.cookie enthält „session=abc123“.','document.cookie contains “session=abc123”.'):tx('document.cookie ist leer – das Cookie existiert, ist aber versteckt.','document.cookie is empty – the cookie exists but is hidden.')):(sent?tx('Das Cookie wird mitgeschickt.','The cookie is sent.'):tx('Das Cookie bleibt weg.','The cookie is left out.')),
   panes:[{t:tx('Gesetzt mit','Set with'),code:msg([set])},sc==='js'?{t:'JavaScript',code:mark(`document.cookie\n// ${sent?'"⟦session=abc123⟧"':'""'}`)}:{t:'Request',code:msg([reqLine,`Host: shop.example`,origin||null,sent?'⟦Cookie: session=abc123⟧':tx('(kein Cookie-Header)','(no Cookie header)')])}],
   flow:[['info',why],...(warn?[['warn',warn]]:[]),...(!ss?[['info',tx('Ohne SameSite behandeln Chrome und Edge das Cookie wie Lax.','Without SameSite, Chrome and Edge treat the cookie as Lax.')]]:[])]};
 },
 rule:tx('Session-Cookies: <code>Secure; HttpOnly; SameSite=Lax</code> – oder Strict, wenn niemand von außen verlinkt.','Session cookies: <code>Secure; HttpOnly; SameSite=Lax</code> – or Strict if nobody links in from outside.'),
 links:[mdn('Cookies')]},

{id:'realcookies',cat:'cookies',title:tx('Echte Cookies setzen','Setting real cookies'),sub:tx('document.cookie auf dieser Seite','document.cookie on this page'),kind:'custom',keys:'document.cookie max-age expires path set delete',
 desc:tx('<p>Diese Demo setzt echte Cookies im Browser, auf <code>daniel-hopium.github.io</code>. Alle Lern-Apps liegen auf demselben Origin – sie würden die Cookies also sehen. Darum beginnen die Namen mit <code>demo-</code>.</p>','<p>This demo sets real cookies in your browser, on <code>daniel-hopium.github.io</code>. All learning apps live on the same origin – so they’d see the cookies too. That’s why the names start with <code>demo-</code>.</p>'),
 html:()=>`<div class="stage"><div class="stage-row"><div class="field"><label for="ha-cn">Name</label><input class="input" id="ha-cn" value="demo-theme" spellcheck="false"></div><div class="field"><label for="ha-cv">${tx('Wert','Value')}</label><input class="input" id="ha-cv" value="dunkel" spellcheck="false"></div><div class="field"><label for="ha-ca">${tx('Lebensdauer','Lifetime')}</label><select id="ha-ca"><option value="">${tx('Sitzung','Session')}</option><option value="60">max-age=60</option><option value="86400">max-age=86400</option></select></div></div>
  <div class="stage-row"><button type="button" class="btn btn-primary btn-sm ha-set">${tx('Cookie setzen','Set cookie')}</button><button type="button" class="btn btn-secondary btn-sm ha-http">${tx('Mit HttpOnly versuchen','Try with HttpOnly')}</button><button type="button" class="btn btn-secondary btn-sm ha-del">${ic('trash')}${tx('Alle demo-Cookies löschen','Delete all demo cookies')}</button></div>
  <div class="ha-out"></div></div>${consoleHTML()}`,
 init(wg){
  const con=makeConsole($('.con-lines',wg),false),out=$('.ha-out',wg);con.reset();
  const demo=()=>document.cookie.split('; ').filter(c=>c.startsWith('demo-'));
  const show=()=>{const d=demo();out.innerHTML=`<p class="sim-lbl">document.cookie (${tx('nur demo-','demo- only')})</p><pre class="code ca-codebox">${d.length?d.map(esc).join('\n'):tx('(keine)','(none)')}</pre>`};
  const name=()=>{let n=$('#ha-cn',wg).value.trim().replace(/[^\w-]/g,'');if(!n.startsWith('demo-'))n='demo-'+n;return n};
  const write=s=>{con.add('log',['document.cookie = "'+s+'"']);document.cookie=s;show()};
  $('.ha-set',wg).addEventListener('click',()=>{const a=$('#ha-ca',wg).value;write(`${name()}=${encodeURIComponent($('#ha-cv',wg).value)}; path=/; SameSite=Lax${location.protocol==='https:'?'; Secure':''}${a?'; max-age='+a:''}`)});
  $('.ha-http',wg).addEventListener('click',()=>{const n=name()+'-http';write(`${n}=geheim; path=/; HttpOnly`);con.add(demo().some(c=>c.startsWith(n+'='))?'log':'warn',[tx('Nichts passiert: HttpOnly-Cookies kann nur der Server setzen. JavaScript ignoriert die ganze Zuweisung.','Nothing happened: only the server can set HttpOnly cookies. JavaScript ignores the whole assignment.')])});
  $('.ha-del',wg).addEventListener('click',()=>{demo().forEach(c=>{const n=c.split('=')[0];write(`${n}=; path=/; max-age=0`)});con.add('log',[tx('Gelöscht wird, indem man das Cookie mit max-age=0 überschreibt.','Deleting means overwriting the cookie with max-age=0.')])});
  show();
 },
 tip:tx('Ein Cookie wird nur gelöscht oder überschrieben, wenn Name, Path und Domain genau passen. Mit falschem Path entsteht ein zweites Cookie gleichen Namens.','A cookie is only deleted or overwritten when name, path and domain match exactly. With the wrong path you create a second cookie of the same name.'),
 links:[mdnApi('Document/cookie')]},

{id:'storage',cat:'cookies',title:tx('Wo der Browser speichert','Where the browser stores things'),sub:'Cookie, localStorage, sessionStorage, IndexedDB',kind:'custom',keys:'localstorage sessionstorage indexeddb storage event quota',
 desc:tx('<p>Vier Speicher, vier Regeln. Der Unterschied, der am meisten zählt: Cookies gehen bei jeder Anfrage mit, alles andere bleibt im Browser.</p>','<p>Four stores, four sets of rules. The difference that matters most: cookies go with every request, everything else stays in the browser.</p>'),
 html:()=>`<div class="table-wrap"><table class="mini"><thead><tr><th scope="col"></th><th scope="col">Cookie</th><th scope="col">localStorage</th><th scope="col">sessionStorage</th><th scope="col">IndexedDB</th></tr></thead><tbody>
  <tr><th scope="row">${tx('Geht zum Server','Sent to server')}</th><td>${yes(1)}</td><td>${yes(0)}</td><td>${yes(0)}</td><td>${yes(0)}</td></tr>
  <tr><th scope="row">${tx('Größe','Size')}</th><td>~4 KB</td><td>~5 MB</td><td>~5 MB</td><td>${tx('viel (GB)','a lot (GB)')}</td></tr>
  <tr><th scope="row">${tx('Lebt bis','Lives until')}</th><td>${tx('Ablaufdatum','expiry')}</td><td>${tx('gelöscht wird','deleted')}</td><td>${tx('Tab zu','tab closes')}</td><td>${tx('gelöscht wird','deleted')}</td></tr>
  <tr><th scope="row">${tx('Gilt für','Scope')}</th><td>${tx('Domain + Path','domain + path')}</td><td>Origin</td><td>${tx('Origin + Tab','origin + tab')}</td><td>Origin</td></tr>
  <tr><th scope="row">${tx('Vor JS versteckbar','Hideable from JS')}</th><td>${yes(1)} (HttpOnly)</td><td>${yes(0)}</td><td>${yes(0)}</td><td>${yes(0)}</td></tr>
  <tr><th scope="row">API</th><td>${tx('String','string')}</td><td>${tx('synchron, String','sync, string')}</td><td>${tx('synchron, String','sync, string')}</td><td>${tx('asynchron, Objekte','async, objects')}</td></tr></tbody></table></div>
  <div class="stage" style="margin-top:12px"><div class="stage-row"><button type="button" class="btn btn-primary btn-sm ha-ls">${tx('localStorage schreiben','Write localStorage')}</button><button type="button" class="btn btn-secondary btn-sm ha-ss">${tx('sessionStorage schreiben','Write sessionStorage')}</button><a class="btn btn-secondary btn-sm" href="${location.pathname}#cookies/storage" target="_blank" rel="noopener">${tx('Diese Seite in neuem Tab','This page in a new tab')}${ic('ext')}</a></div><dl class="kv ha-out"></dl></div>${consoleHTML(tx('Ereignisse','Events'))}`,
 init(wg){
  const con=makeConsole($('.con-lines',wg),false),K='http-atlas:demo';con.reset();
  const get=s=>{try{return s.getItem(K)}catch(e){return null}};
  const show=()=>{$('.ha-out',wg).innerHTML=`<dt>localStorage</dt><dd>${esc(get(localStorage)??'–')}</dd><dt>sessionStorage</dt><dd>${esc(get(sessionStorage)??'–')}</dd>`};
  const now=()=>new Date().toLocaleTimeString(LOCALE);
  $('.ha-ls',wg).addEventListener('click',()=>{try{localStorage.setItem(K,now())}catch(e){}show()});
  $('.ha-ss',wg).addEventListener('click',()=>{try{sessionStorage.setItem(K,now())}catch(e){}show()});
  const onStorage=e=>{if(e.key===K){con.add('log',[tx(`storage-Event aus einem anderen Tab: localStorage ist jetzt ${e.newValue}`,`storage event from another tab: localStorage is now ${e.newValue}`)]);show()}};
  window.addEventListener('storage',onStorage);
  con.add('log',[tx('Öffne die Seite in einem zweiten Tab und schreib dort in den localStorage – hier kommt ein storage-Event an. sessionStorage teilen die Tabs nicht.','Open the page in a second tab and write to localStorage there – a storage event arrives here. Tabs don’t share sessionStorage.')]);
  show();
  return ()=>window.removeEventListener('storage',onStorage);
 },
 tip:tx('localStorage ist für jedes Skript der Seite lesbar. Ein Token dort ist bei XSS sofort weg – ein HttpOnly-Cookie nicht.','localStorage is readable by every script on the page. A token there is gone at the first XSS – an HttpOnly cookie isn’t.'),
 links:[mdnApi('Web_Storage_API')]},

/* ---------- CORS ---------- */
{id:'cors',cat:'cors',title:tx('CORS-Simulator','CORS simulator'),sub:tx('Einfache Anfrage oder Preflight?','Simple request or preflight?'),kind:'sim',keys:'cors preflight options access-control-allow-origin credentials simple request',
 desc:tx('<p>Deine App läuft auf <code>https://app.example</code> und ruft eine API auf. Stell Anfrage und Server ein und sieh, was der Browser tut – inklusive der Fehlermeldung, die du sonst in der Konsole findest.</p>','<p>Your app runs on <code>https://app.example</code> and calls an API. Configure the request and the server and see what the browser does – including the error message you’d otherwise find in the console.</p>'),
 ctl:[{k:'t',type:'radio',label:tx('API-Adresse','API address'),def:'other',opts:[['same','https://app.example/api'],['sub','https://api.app.example'],['other','https://api.other.com']]},
  {k:'m',type:'radio',label:tx('Methode','Method'),def:'GET',opts:['GET','POST','PUT','DELETE'].map(x=>[x,x])},
  {k:'ct',type:'radio',label:'Content-Type',def:'none',opts:[['none',tx('(kein Body)','(no body)')],['form','text/plain'],['json','application/json']]},
  {k:'r',type:'checks',label:tx('Anfrage','Request'),opts:[['auth',tx('Header Authorization','Header Authorization')],['cred','credentials: "include"']]},
  {k:'acao',type:'radio',label:tx('Server: Access-Control-Allow-Origin','Server: Access-Control-Allow-Origin'),def:'exact',opts:[['none',tx('(fehlt)','(missing)')],['star','*'],['exact','https://app.example']]},
  {k:'s',type:'checks',label:tx('Server erlaubt außerdem','Server also allows'),opts:[['methods','Allow-Methods: PUT, DELETE'],['headers','Allow-Headers: Authorization, Content-Type'],['creds','Allow-Credentials: true']]}],
 run({t,m,ct,r,acao,s}){
  const api={same:'https://app.example',sub:'https://api.app.example',other:'https://api.other.com'}[t];
  const reqLine=`${m} /items HTTP/1.1`,body=ct!=='none';
  const reqH=[reqLine,`Host: ${api.replace('https://','')}`,t!=='same'?'⟦Origin: https://app.example⟧':null,body?`Content-Type: ${ct==='json'?'application/json':'text/plain'}`:null,r.auth?'Authorization: Bearer eyJ…':null,r.cred?'Cookie: session=abc123':null];
  if(t==='same')return {v:'ok',verdict:tx('Gleicher Origin: Hier greift CORS gar nicht. Alles erlaubt.','Same origin: CORS doesn’t apply at all. Everything is allowed.'),panes:[{t:'Request',code:msg(reqH)}]};
  const simple=['GET','POST','HEAD'].includes(m)&&ct!=='json'&&!r.auth;
  const needH=[ct==='json'?'content-type':null,r.auth?'authorization':null].filter(Boolean);
  const originOk=acao==='exact'||(acao==='star'&&!r.cred),credOk=!r.cred||s.creds;
  const resH=[acao==='none'?null:`Access-Control-Allow-Origin: ${acao==='star'?'*':'https://app.example'}`,s.creds?'Access-Control-Allow-Credentials: true':null];
  const flow=[['info',t==='sub'?tx('api.app.example ist ein anderer <b>Origin</b>, aber dieselbe <b>Site</b>: CORS gilt, SameSite-Cookies gehen trotzdem mit.','api.app.example is a different <b>origin</b> but the same <b>site</b>: CORS applies, SameSite cookies are still sent.'):tx('Anderer Origin: Der Browser schickt einen Origin-Header und prüft die Antwort.','Different origin: the browser sends an Origin header and checks the response.')]];
  const err=why=>`Access to fetch at '${api}/items' from origin 'https://app.example' has been blocked by CORS policy: ${why}`;
  const panes=[];
  let blocked=null;
  if(!simple){
    const pfOk=originOk&&credOk&&(!['PUT','DELETE'].includes(m)||s.methods)&&(!needH.length||s.headers);
    panes.push({t:'Preflight Request',code:msg([`⟦OPTIONS⟧ /items HTTP/1.1`,`Host: ${api.replace('https://','')}`,'Origin: https://app.example',`⟦Access-Control-Request-Method: ${m}⟧`,needH.length?`⟦Access-Control-Request-Headers: ${needH.join(', ')}⟧`:null])},
      {t:'Preflight Response',code:msg(['HTTP/1.1 204 No Content',...resH,s.methods?'Access-Control-Allow-Methods: GET, POST, PUT, DELETE':null,s.headers?'Access-Control-Allow-Headers: Authorization, Content-Type':null,'Access-Control-Max-Age: 600'])});
    flow.push(['warn',tx(`Keine „einfache“ Anfrage (${[!['GET','POST','HEAD'].includes(m)?m:null,ct==='json'?'JSON':null,r.auth?'Authorization':null].filter(Boolean).join(', ')}): Der Browser fragt erst mit OPTIONS um Erlaubnis.`,`Not a “simple” request (${[!['GET','POST','HEAD'].includes(m)?m:null,ct==='json'?'JSON':null,r.auth?'Authorization':null].filter(Boolean).join(', ')}): the browser first asks permission with OPTIONS.`)]);
    if(!pfOk){
      blocked=!originOk?(acao==='star'?'The value of the \'Access-Control-Allow-Origin\' header must not be the wildcard \'*\' when the request\'s credentials mode is \'include\'.':'Response to preflight request doesn\'t pass access control check: No \'Access-Control-Allow-Origin\' header is present on the requested resource.')
        :!credOk?'The value of the \'Access-Control-Allow-Credentials\' header in the response is \'\' which must be \'true\' when the request\'s credentials mode is \'include\'.'
        :['PUT','DELETE'].includes(m)&&!s.methods?`Method ${m} is not allowed by Access-Control-Allow-Methods in preflight response.`
        :`Request header field ${needH[needH.length-1]} is not allowed by Access-Control-Allow-Headers in preflight response.`;
      flow.push(['bad',tx('Preflight abgelehnt: Die eigentliche Anfrage wird <b>nie gesendet</b>.','Preflight rejected: the actual request is <b>never sent</b>.')]);
      return {v:'bad',verdict:tx('Blockiert vom Browser.','Blocked by the browser.'),panes,flow,html:`<pre class="code ca-codebox" style="color:var(--danger)">${esc(err(blocked))}</pre>`};
    }
    flow.push(['ok',tx('Preflight bestanden. Der Browser merkt sich das 600 s lang (Max-Age).','Preflight passed. The browser remembers it for 600 s (Max-Age).')]);
  }else flow.push(['ok',tx('Einfache Anfrage: kein Preflight, sie geht direkt raus.','Simple request: no preflight, it goes straight out.')]);
  panes.push({t:'Request',code:msg(reqH)},{t:'Response',code:msg(['HTTP/1.1 200 OK',...resH,'Content-Type: application/json','','[ … ]'])});
  if(!originOk||!credOk){
    blocked=!originOk?(acao==='star'?'The value of the \'Access-Control-Allow-Origin\' header must not be the wildcard \'*\' when the request\'s credentials mode is \'include\'.':'No \'Access-Control-Allow-Origin\' header is present on the requested resource.'):'The value of the \'Access-Control-Allow-Credentials\' header in the response is \'\' which must be \'true\' when the request\'s credentials mode is \'include\'.';
    flow.push(['bad',tx('Die Anfrage <b>kam beim Server an und wurde ausgeführt</b>. Nur deine Seite darf die Antwort nicht lesen.','The request <b>reached the server and was executed</b>. Only your page may not read the response.')]);
    return {v:'bad',verdict:tx('Blockiert – aber erst beim Lesen der Antwort.','Blocked – but only when reading the response.'),panes,flow,html:`<pre class="code ca-codebox" style="color:var(--danger)">${esc(err(blocked))}</pre>`};
  }
  flow.push(['ok',tx('Der Browser gibt die Antwort an dein JavaScript weiter.','The browser hands the response to your JavaScript.')]);
  return {v:'ok',verdict:tx('Erlaubt.','Allowed.'),panes,flow};
 },
 tip:tx('CORS schützt nicht den Server, sondern den Nutzer: Es verhindert, dass eine fremde Seite mit seinen Cookies Daten liest. Mit curl oder Postman gibt es kein CORS.','CORS doesn’t protect the server but the user: it stops a foreign site from reading data with their cookies. curl or Postman have no CORS at all.'),
 rule:tx('Im Angular-Dev-Server lieber einen Proxy (<code>proxy.conf.json</code>) einrichten als CORS auf dem Backend aufzumachen.','In the Angular dev server, set up a proxy (<code>proxy.conf.json</code>) rather than opening CORS on the backend.'),
 links:[mdn('CORS')]},

{id:'origin',cat:'cors',title:tx('Origin oder Site?','Origin or site?'),sub:tx('Zwei Begriffe, zwei Regeln','Two terms, two rules'),kind:'custom',keys:'origin site same-origin same-site etld public suffix github.io',
 desc:tx('<p><b>Origin</b> = Schema + Host + Port – für CORS und localStorage. <b>Site</b> = Schema + registrierbare Domain – für SameSite-Cookies. Vergleich zwei Adressen.</p>','<p><b>Origin</b> = scheme + host + port – for CORS and localStorage. <b>Site</b> = scheme + registrable domain – for SameSite cookies. Compare two addresses.</p>'),
 html:()=>`<div class="stage"><div class="stage-row"><div class="field" style="flex:1 1 240px"><label for="ha-o1">${tx('Seite','Page')}</label><input class="input" id="ha-o1" value="https://app.example.com" spellcheck="false"></div><div class="field" style="flex:1 1 240px"><label for="ha-o2">${tx('Anfrage an','Request to')}</label><input class="input" id="ha-o2" value="https://api.example.com" spellcheck="false"></div></div>
  <div class="presets">${[['https://app.example.com','https://app.example.com:8443'],['http://example.com','https://example.com'],['https://daniel-hopium.github.io','https://someone-else.github.io'],['https://shop.co.uk','https://bank.co.uk'],['http://localhost:4200','http://localhost:8080']].map(([a,b])=>`<button type="button" data-a="${a}" data-b="${b}">${a.replace(/^https?:\/\//,'')} ↔ ${b.replace(/^https?:\/\//,'')}</button>`).join('')}</div><div class="ha-out"></div></div>`,
 init(wg){
  const a=$('#ha-o1',wg),b=$('#ha-o2',wg),out=$('.ha-out',wg);
  const upd=()=>{
    let u1,u2;try{u1=new URL(a.value);u2=new URL(b.value)}catch(e){out.innerHTML=`<p class="verdict v-bad">${ic('xc')}<span>${tx('Bitte zwei vollständige URLs.','Please enter two full URLs.')}</span></p>`;return}
    const so=u1.origin===u2.origin,s1=u1.protocol+'//'+siteOf(u1.hostname),s2=u2.protocol+'//'+siteOf(u2.hostname),ss=s1===s2;
    out.innerHTML=`<table class="mini"><thead><tr><th scope="col"></th><th scope="col">${tx('Seite','Page')}</th><th scope="col">${tx('Ziel','Target')}</th><th scope="col">${tx('gleich?','same?')}</th></tr></thead><tbody><tr><th scope="row">Origin</th><td><code>${esc(u1.origin)}</code></td><td><code>${esc(u2.origin)}</code></td><td>${yes(so)}</td></tr><tr><th scope="row">Site</th><td><code>${esc(s1)}</code></td><td><code>${esc(s2)}</code></td><td>${yes(ss)}</td></tr></tbody></table>
    <ol class="flow"><li class="fl-${so?'ok':'warn'}"><span>${so?tx('Gleicher Origin: kein CORS, gemeinsamer localStorage.','Same origin: no CORS, shared localStorage.'):tx('Anderer Origin: fetch braucht CORS-Header vom Server, getrennter localStorage.','Different origin: fetch needs CORS headers from the server, separate localStorage.')}</span></li><li class="fl-${ss?'ok':'warn'}"><span>${ss?tx('Gleiche Site: SameSite=Lax/Strict-Cookies werden mitgeschickt.','Same site: SameSite=Lax/Strict cookies are sent.'):tx('Andere Site: Lax/Strict-Cookies bleiben bei eingebetteten Anfragen weg.','Different site: Lax/Strict cookies are left out of embedded requests.')}</span></li>${/github\.io$|co\.uk$/.test(u1.hostname)&&!ss?`<li class="fl-info"><span>${tx('github.io und co.uk stehen auf der Public Suffix List. Jede Subdomain darunter ist eine eigene Site – sonst könnte jeder GitHub-Nutzer Cookies für alle anderen setzen.','github.io and co.uk are on the Public Suffix List. Every subdomain under them is a site of its own – otherwise any GitHub user could set cookies for everyone else.')}</span></li>`:''}</ol>`;
  };
  wg.addEventListener('input',upd);
  wg.addEventListener('click',e=>{const p=e.target.closest('[data-a]');if(p){a.value=p.dataset.a;b.value=p.dataset.b;upd()}});
  upd();
 },
 links:[['https://web.dev/articles/same-site-same-origin','web.dev: same-site & same-origin']]},

/* ---------- Verbindung ---------- */
{id:'handshake',cat:'connection',title:tx('Vor dem ersten Byte','Before the first byte'),sub:'DNS, TCP, TLS',kind:'sim',keys:'dns tcp tls handshake rtt latency ttfb http3 quic keep-alive',
 desc:tx('<p>Bevor eine Anfrage rausgeht, braucht es eine Verbindung. Jeder Schritt kostet einen oder mehrere Roundtrips (RTT) – und RTT ist Lichtgeschwindigkeit plus Router, also nicht wegoptimierbar.</p>','<p>Before a request goes out you need a connection. Each step costs one or more round trips (RTT) – and RTT is the speed of light plus routers, so it can’t be optimised away.</p>'),
 ctl:[{k:'rtt',type:'range',label:tx('Roundtrip-Zeit (RTT)','Round-trip time (RTT)'),min:10,max:300,step:10,def:80,unit:' ms'},
  {k:'p',type:'radio',label:tx('Verbindung','Connection'),def:'h2',opts:[['h1',tx('HTTP/1.1 + TLS 1.2, neu','HTTP/1.1 + TLS 1.2, new')],['h2',tx('HTTP/2 + TLS 1.3, neu','HTTP/2 + TLS 1.3, new')],['h3','HTTP/3 (QUIC)'],['reuse',tx('Bestehende Verbindung','Existing connection')]]},
  {k:'x',type:'checks',label:tx('Außerdem','Also'),opts:[['dns',tx('DNS schon im Cache','DNS already cached')]]}],
 run({rtt,p,x}){
  const server=60,dl=40,dns=p==='reuse'||x.dns?0:rtt;
  const tcp=p==='h1'||p==='h2'?rtt:0,tls=p==='h1'?2*rtt:p==='h2'?rtt:p==='h3'?rtt:0;
  const segs=[['dns',dns],['tcp',tcp],['tls',tls],['ttfb',rtt+server],['dl',dl]],total=segs.reduce((s,[,v])=>s+v,0);
  const n=(dns?1:0)+(tcp?1:0)+(p==='h1'?2:p==='reuse'?0:1)+1;
  return {v:total<300?'ok':total<800?'warn':'bad',verdict:tx(`${Math.round(total)} ms bis die Datei da ist – davon ${n} Roundtrips à ${rtt} ms.`,`${Math.round(total)} ms until the file is here – including ${n} round trips of ${rtt} ms.`),
   html:waterfall([['index.html',segs]],['dns','tcp','tls','ttfb','dl']),
   flow:[[p==='h3'?'ok':'info',p==='h3'?tx('QUIC legt Transport und Verschlüsselung in einen Roundtrip zusammen und läuft über UDP.','QUIC merges transport and encryption into one round trip and runs over UDP.'):p==='h1'?tx('TLS 1.2 braucht zwei Roundtrips für den Schlüsselaustausch, TLS 1.3 nur einen.','TLS 1.2 needs two round trips for the key exchange, TLS 1.3 only one.'):p==='reuse'?tx('Keep-alive: Die Verbindung steht schon. Nur noch die Anfrage selbst kostet Zeit.','Keep-alive: the connection already exists. Only the request itself costs time.'):tx('TCP-Handshake und TLS 1.3 kosten je einen Roundtrip.','TCP handshake and TLS 1.3 each cost one round trip.')],
    ['info',tx('Mit <code>&lt;link rel="preconnect" href="https://cdn.example"&gt;</code> baut der Browser die Verbindung zu einer anderen Domain schon auf, bevor er sie braucht.','With <code>&lt;link rel="preconnect" href="https://cdn.example"&gt;</code> the browser opens the connection to another domain before it needs it.')]]};
 },
 rule:tx('Gegen Latenz hilft nur: weniger Roundtrips (HTTP/2, HTTP/3, preconnect) oder kürzere Wege (CDN).','Only two things beat latency: fewer round trips (HTTP/2, HTTP/3, preconnect) or shorter paths (CDN).'),
 links:[['https://developer.mozilla.org/'+tx('de','en-US')+'/docs/Web/Performance/Guides/Understanding_latency','MDN']]},

{id:'multiplex',cat:'connection',title:tx('HTTP/1.1 gegen HTTP/2','HTTP/1.1 vs HTTP/2'),sub:tx('Viele kleine Dateien','Many small files'),kind:'sim',keys:'http2 multiplexing head of line blocking connections bundling',
 desc:tx('<p>Eine Seite braucht viele kleine Dateien. HTTP/1.1 kann pro Verbindung nur eine Anfrage gleichzeitig – Browser öffnen darum höchstens sechs Verbindungen pro Host. HTTP/2 schickt alle über eine.</p>','<p>A page needs many small files. HTTP/1.1 can only do one request per connection at a time – so browsers open at most six connections per host. HTTP/2 sends them all over one.</p>'),
 ctl:[{k:'n',type:'range',label:tx('Anzahl Dateien','Number of files'),min:6,max:30,step:1,def:18},{k:'rtt',type:'range',label:'RTT',min:20,max:200,step:10,def:80,unit:' ms'},{k:'p',type:'radio',label:tx('Protokoll','Protocol'),def:'h1',opts:[['h1','HTTP/1.1'],['h2','HTTP/2']]}],
 run({n,rtt,p}){
  const t=15,rows=[];
  for(let i=0;i<n;i++){

  return {v:p==='h2'?'ok':'warn',verdict:tx(`Alle ${n} Dateien nach ${Math.round(total)} ms.`,`All ${n} files after ${Math.round(total)} ms.`),

{id:'timing',cat:'connection',title:tx('Echt gemessen','Measured for real'),sub:'Resource Timing API',kind:'custom',keys:'resource timing performance getentriesbyname transfersize nexthopprotocol ttfb',

/* ---------- Engine: Kapitel, Einträge, Widgets ----------
   Jede App liefert APP, CATS und ENTRIES. Ein Eintrag hat id, cat, title, sub, desc, kind und die Daten
   für sein Widget (KINDS[kind]); dazu optional tip, rule, links und keys für die Suche. */
const BY=Object.fromEntries(ENTRIES.map(e=>[e.id,e]));
const CAT_BY=Object.fromEntries(CATS.map(c=>[c.id,c]));
const plain=s=>String(s).replace(/<[^>]+>/g,'');
const nEntries=n=>tx(n===1?'1 Eintrag':`${n} Einträge`,n===1?'1 entry':`${n} entries`);

/* Syntax-Hervorhebung für JS – bewusst klein: Kommentare, Strings, Zahlen, Schlüsselwörter */
const KW=new Set('const let var function return if else for of in while do new class extends this async await try catch finally throw typeof instanceof null undefined true false break continue switch case default delete void yield static super import export from'.split(' '));
function hlJS(src){
  const re=/(\/\/[^\n]*|\/\*[\s\S]*?\*\/)|(`(?:\\[\s\S]|[^`\\])*`|'(?:\\.|[^'\\\n])*'|"(?:\\.|[^"\\\n])*")|(\b\d[\d_]*(?:\.\d+)?(?:e[+-]?\d+)?n?\b)|([A-Za-z_$][\w$]*)/g;
  let out='',last=0,m;
  while((m=re.exec(src))){
    out+=esc(src.slice(last,m.index));
    const t=m[0];
    out+=m[1]?`<span class="tk-c">${esc(t)}</span>`:m[2]?`<span class="tk-s">${esc(t)}</span>`:m[3]?`<span class="tk-n">${esc(t)}</span>`:KW.has(t)?`<span class="tk-k">${esc(t)}</span>`:esc(t);
    last=re.lastIndex;
  }
  return out+esc(src.slice(last));
}
/* Code mit Markierung: ⟦…⟧ im Text wird hervorgehoben, alles andere escaped */
const mark=s=>esc(s).replace(/⟦([\s\S]*?)⟧/g,'<span class="ca-hl">$1</span>');

/* Wasserfall-Diagramm: rows = [[Label, [[Phase, ms], …], Start-ms]] */
const PH={dns:'DNS',tcp:'TCP',tls:'TLS',wait:tx('Warten','Waiting'),ttfb:tx('Anfrage → erstes Byte','Request → first byte'),dl:'Download',parse:tx('Parsen & Kompilieren','Parse & compile'),exec:tx('Ausführen','Execute'),render:tx('Rendern','Render'),block:tx('Blockiert','Blocked')};
function waterfall(rows,phases){
  const ends=rows.map(([,segs,start=0])=>start+segs.reduce((s,[,ms])=>s+ms,0)),max=Math.max(...ends,1);
  return `<div class="wf" role="img" aria-label="${tx('Zeitachse der Anfragen','Request timeline')}">${rows.map(([lbl,segs,start=0],i)=>{let t=start;return `<div class="wf-row"><span class="wf-lbl">${esc(lbl)}</span><span class="wf-track">${segs.filter(([,ms])=>ms>0).map(([ph,ms])=>{const h=`<span class="wf-seg ph-${ph}" style="left:${t/max*100}%;width:${ms/max*100}%" title="${PH[ph]}: ${Math.round(ms)} ms"></span>`;t+=ms;return h}).join('')}</span><span class="wf-t">${Math.round(ends[i])} ms</span></div>`}).join('')}</div>
  <ul class="wf-legend">${phases.map(p=>`<li><i class="ph-${p}"></i>${PH[p]}</li>`).join('')}</ul>`;
}

/* Werte wie in den DevTools ausgeben: Strings oben ohne, verschachtelt mit Anführungszeichen */
function fmt(v,top=true,depth=0){
  if(v===globalThis)return 'Window {…}';
  if(typeof v==='string')return top?v:`'${v}'`;
  if(v===undefined)return 'undefined';
  if(v===null)return 'null';
  if(typeof v==='number')return Object.is(v,-0)?'-0':String(v);
  if(typeof v==='bigint')return v+'n';
  if(typeof v!=='object'&&typeof v!=='function')return String(v);
  if(typeof v==='function')return `ƒ ${v.name||tx('(anonym)','(anonymous)')}()`;
  if(v instanceof Error)return `${v.name}: ${v.message}`;
  if(v instanceof Promise)return 'Promise {…}';
  if(depth>2)return Array.isArray(v)?'[…]':'{…}';
  if(Array.isArray(v))return `[${v.map(x=>fmt(x,false,depth+1)).join(', ')}]`;
  if(v instanceof Map)return `Map(${v.size}) {${[...v].map(([k,x])=>fmt(k,false,depth+1)+' => '+fmt(x,false,depth+1)).join(', ')}}`;
  if(v instanceof Set)return `Set(${v.size}) {${[...v].map(x=>fmt(x,false,depth+1)).join(', ')}}`;
  if(v instanceof Date)return v.toISOString();
  const proto=Object.getPrototypeOf(v),name=proto&&proto!==Object.prototype&&proto.constructor?proto.constructor.name+' ':'';
  return `${name}{${Object.keys(v).map(k=>`${/^[A-Za-z_$][\w$]*$/.test(k)?k:`'${k}'`}: ${fmt(v[k],false,depth+1)}`).join(', ')}}`;
}

/* Konsole: eine Liste, in die Demos schreiben. token sorgt dafür, dass alte Timer nach einem
   Neustart nicht mehr in die neue Ausgabe schreiben. */
function makeConsole(ol,timed){
  let token=0,t0=0;
  const api={
    reset(){token++;t0=performance.now();ol.innerHTML='';return token},
    add(type,args,tok=token){
      if(tok!==token)return;
      const li=document.createElement('li');li.className='con-'+type;
      if(timed){const t=document.createElement('span');t.className='con-t';t.textContent=Math.round((performance.now()-t0)/10)*10+' ms';li.append(t)}
      const m=document.createElement('span');m.textContent=args.map(a=>fmt(a)).join(' ');li.append(m);
      ol.append(li);
    },
    bound(tok){const a=(type)=>(...x)=>api.add(type,x,tok);return {log:a('log'),info:a('log'),warn:a('warn'),error:a('error')}}
  };
  return api;
}
const consoleHTML=(label=tx('Konsole','Console'))=>`<div class="console"><p class="console-h">${label}</p><ol class="con-lines" role="log" aria-label="${label}" data-empty="${tx('(noch keine Ausgabe)','(no output yet)')}"></ol></div>`;

const KINDS={};

/* run: Code-Varianten, die wirklich ausgeführt werden. Der Code läuft in einer async-Funktion,
   darum geht await auf oberster Ebene. sleep(ms) steht als Hilfsfunktion bereit. */
KINDS.run={
  html:e=>`${e.vars.length>1?`<fieldset class="ca-vals"><legend class="sr-only">${tx('Variante wählen','Choose a variant')}</legend>${e.vars.map((v,i)=>`<label><input type="radio" name="v-${e.id}" value="${i}"${i===(e.def||0)?' checked':''}>${v[0]}</label>`).join('')}</fieldset>`:''}
  <div class="ca-codebox"><pre class="code" tabindex="0" role="region" aria-label="${tx('Code','Code')}"><code></code></pre>
  <div class="run-bar"><button type="button" class="btn btn-primary btn-sm run-go">${ic('play2')}${tx('Ausführen','Run')}</button><span class="run-hint">${e.timed?tx('Die Zeit links zeigt, wann eine Zeile kam.','The time on the left shows when a line arrived.'):tx('Läuft echt in deinem Browser.','Runs for real in your browser.')}</span></div></div>
  ${consoleHTML()}<p class="ca-note" hidden></p>`,
  init(art,e){
    const con=makeConsole($('.con-lines',art),e.timed);
    let cur=e.def||0;
    const show=i=>{
      cur=i;const [,code,note]=e.vars[i];
      $('pre code',art).innerHTML=hlJS(code);
      const n=$('.ca-note',art);n.hidden=!note;n.innerHTML=note||'';
      run();
    };
    function run(){
      const tok=con.reset(),c=con.bound(tok),code=e.vars[cur][1];
      const sleep=ms=>new Promise(r=>setTimeout(r,ms));
      let fn;
      try{fn=new Function('console','sleep',`return (async()=>{\n${code}\n})()`)}
      catch(err){con.add('error',[`SyntaxError: ${err.message}`],tok);return}
      fn(c,sleep).catch(err=>con.add('error',['Uncaught '+(err instanceof Error?`${err.name}: ${err.message}`:fmt(err,false))],tok));
    }
    art.addEventListener('change',ev=>{if(ev.target.name===`v-${e.id}`)show(+ev.target.value)});
    $('.run-go',art).addEventListener('click',run);
    show(cur);
    return ()=>con.reset();
  }
};

/* trace: Event Loop Schritt für Schritt. Ein Schritt ist [Zeile, Operationen, Erklärung].
   Operationen, durch ; getrennt: s+X / s- (Call Stack), a+X / a-X (Web APIs), m+X / m- (Microtasks),
   t+X / t- (Tasks), r+X / r- (Frame-Callbacks), o X (Konsole). Der Zustand wird für jeden Schritt aus
   allen vorherigen neu berechnet – so geht auch „zurück“ ohne Sonderfälle. */
function trState(e,n){
  const s={stack:[],api:[],micro:[],task:[],raf:[],out:[],line:0,note:e.start||tx('Drück „Weiter“, um den Code Schritt für Schritt laufen zu lassen.','Press “Next” to run the code step by step.'),fresh:new Set()};
  const key={s:'stack',a:'api',m:'micro',t:'task',r:'raf'};
  for(let i=0;i<n;i++){
    const [line,ops,note]=e.steps[i];s.line=line;s.note=note;s.fresh=new Set();
    (ops||'').split(';').map(x=>x.trim()).filter(Boolean).forEach(op=>{
      if(op.startsWith('o ')){s.out.push(op.slice(2));s.fresh.add('out:'+op.slice(2));return}
      const L=s[key[op[0]]],arg=op.slice(2).trim();
      if(op[1]==='+'){L.push(arg);s.fresh.add(key[op[0]]+':'+arg)}
      else if(op[0]==='s')L.pop();
      else if(op[0]==='a'){const i=L.indexOf(arg);if(i>=0)L.splice(i,1)}
      else L.shift();
    });
  }
  return s;
}
KINDS.trace={
  html:e=>{
    const box=(k,cls,title)=>`<section class="tr-box ${cls}" aria-label="${title}"><h3>${title}</h3><ol data-k="${k}"></ol></section>`;
    return `<div class="tr">
    <div class="ca-codebox tr-code"><pre class="code" tabindex="0" role="region" aria-label="Code"><code>${e.code.split('\n').map((l,i)=>`<span class="ln" data-n="${i+1}">${hlJS(l)||' '}</span>`).join('')}</code></pre></div>
    <div class="tr-boxes">${box('stack','tr-stack','Call Stack')}${box('api','tr-api','Web APIs')}${box('micro','tr-micro',tx('Microtask-Queue','Microtask queue'))}${box('task','tr-task',tx('Task-Queue','Task queue'))}${e.raf?box('raf','tr-raf',tx('Vor dem nächsten Frame','Before next frame')):''}${box('out','tr-out',tx('Konsole','Console'))}</div>
    <p class="tr-note" aria-live="polite"></p>
    <div class="tr-bar"><span class="tr-pos"></span><button type="button" class="btn btn-secondary btn-sm tr-reset">${ic('refresh')}${tx('Von vorn','Restart')}</button><button type="button" class="btn btn-secondary btn-sm tr-prev">${ic('back')}${tx('Zurück','Back')}</button><button type="button" class="btn btn-primary btn-sm tr-next">${tx('Weiter','Next')}${ic('fwd')}</button><button type="button" class="btn btn-secondary btn-sm tr-play" aria-pressed="false">${ic('play2')}<span>${tx('Abspielen','Play')}</span></button></div>
    </div>`;
  },
  init(art,e){
    let n=0,timer=null;const N=e.steps.length;
    function draw(){
      const s=trState(e,n);
      $$('.tr-code .ln',art).forEach((l,i)=>l.classList.toggle('is-cur',i+1===s.line));
      ['stack','api','micro','task','raf','out'].forEach(k=>{
        const ol=$(`ol[data-k="${k}"]`,art);if(!ol)return;
        ol.innerHTML=s[k].map(x=>`<li${s.fresh.has(k+':'+x)?' class="is-new"':''}>${esc(x)}</li>`).join('');
      });
      $('.tr-note',art).innerHTML=s.note;
      $('.tr-pos',art).textContent=tx(`Schritt ${n} von ${N}`,`Step ${n} of ${N}`);
      $('.tr-prev',art).disabled=n===0;$('.tr-next',art).disabled=n===N;
      if(n===N)stop();
    }
    function stop(){clearInterval(timer);timer=null;const b=$('.tr-play',art);b.setAttribute('aria-pressed','false');$('span',b).textContent=tx('Abspielen','Play')}
    $('.tr-next',art).addEventListener('click',()=>{if(n<N){n++;draw()}});
    $('.tr-prev',art).addEventListener('click',()=>{if(n>0){n--;draw()}});
    $('.tr-reset',art).addEventListener('click',()=>{stop();n=0;draw()});
    $('.tr-play',art).addEventListener('click',ev=>{
      const b=ev.currentTarget;
      if(timer){stop();return}
      if(n===N)n=0;
      b.setAttribute('aria-pressed','true');$('span',b).textContent=tx('Anhalten','Pause');
      timer=setInterval(()=>{n++;draw()},reducedMotion()?1800:1200);draw();
    });
    draw();
    return ()=>clearInterval(timer);
  }
};

/* sim: Regler setzen, run(state) berechnet Urteil, Nachrichten und Ablauf.

function simOut(r){

  <nav aria-label="${tx('Einträge in','Entries in')} ${plain(c.title)}" class="ca-toc"><ul class="chips">${es.map(e=>`<li><a href="#${cat}/${e.id}">${e.title}</a></li>`).join('')}</ul></nav>
  ${es.map(entryHTML).join('')}
  <nav class="pager" aria-label="${tx('Weitere Kapitel','More chapters')}">${prev?`<a class="prev" href="#${prev.id}"><small>${tx('← Voriges Kapitel','← Previous chapter')}</small>${prev.title}</a>`:`<a class="prev" href="#start">${back(tx('← Zurück zum','← Back to the'))}</a>`}${next?`<a class="next" href="#${next.id}"><small>${tx('Nächstes Kapitel →','Next chapter →')}</small>${next.title}</a>`:`<a class="next" href="#start">${back(tx('Zurück zum','Back to the'))}</a>`}</nav>
</article>`;
}
function catInit(root,sub){
  const cleanups=[];
  $$('.ca-entry',root).forEach(art=>{
    const e=BY[art.dataset.id];
    try{const c=KINDS[e.kind].init(art,e);if(typeof c==='function')cleanups.push(c)}
    catch(err){console.error(e.id,err)}
  });
  const hit=BY[sub]&&$('#ca-'+sub,root);
  if(hit){hit.classList.add('ca-hit');requestAnimationFrame(()=>hit.scrollIntoView({block:'start'}))}
  return ()=>cleanups.forEach(f=>{try{f()}catch(e){}});
}

/* Schwester-Apps: alle Lern-Apps außer dieser */
const SISTERS=[
  ['ui-atlas','UI-Atlas',tx('UI-Regeln mit Live-Beispielen und Negativbeispielen.','UI rules with live examples and counter-examples.')],
  ['aria-compass',tx('ARIA-Kompass','ARIA Compass'),tx('Rollen, Namen und Zustände mit Inspektor und Screenreader-Trainer.','Roles, names and states with an inspector and a screen reader trainer.')],
  ['html-atlas','HTML-Atlas',tx('HTML-Elemente und Attribute mit Live-Vorschau.','HTML elements and attributes with live previews.')],
  ['css-atlas','CSS-Atlas',tx('CSS-Eigenschaften zum Anklicken, mit Tailwind-Klasse.','CSS properties to click through, with the Tailwind class.')],
  ['angular-patterns','Angular-Patterns',tx('Modernes Angular mit „So nicht – so“-Code und Live-Simulation.','Modern Angular with “not like this – like this” code and live simulation.')],
  ['access-compass',tx('Rechte-Kompass','Access Compass'),tx('Login und Rechte: OAuth, OIDC, JWT, RBAC bis ReBAC.','Login and permissions: OAuth, OIDC, JWT, RBAC to ReBAC.')],
  ['js-runtime',tx('JS-Laufzeit','JS Runtime'),tx('Event Loop, Promises, Closures und this Schritt für Schritt.','Event loop, promises, closures and this, step by step.')],
  ['http-atlas','HTTP-Atlas',tx('Requests, Caching, Cookies und CORS zum Durchspielen.','Requests, caching, cookies and CORS to play through.')],
  ['security-lab',tx('Sicherheits-Labor','Security Lab'),tx('XSS, CSP, CSRF und Co. – Angriff und Abwehr in der Sandbox.','XSS, CSP, CSRF and more – attack and defence in a sandbox.')],
  ['perf-atlas','Performance-Atlas',tx('Core Web Vitals, Rendering und JavaScript-Kosten – echt gemessen.','Core Web Vitals, rendering and JavaScript cost – measured for real.')],
  ['regex-lab',tx('Regex-Werkstatt','Regex Workshop'),tx('Reguläre Ausdrücke live gegen Text, mit Erklärung pro Baustein.','Regular expressions live against text, explained piece by piece.')],
  ['algo-visualizer',tx('Algorithmen-Visualizer','Algorithm Visualizer'),tx('Sortieren, Suchen und Graphen Schritt für Schritt.','Sorting, searching and graphs step by step.')]
].filter(([id])=>id!==APP.slug);
const sistersHTML=()=>`<div class="start-grid sisters">${SISTERS.map(([id,name,d])=>`<div class="tile"><h3><img class="sis-ic" src="https://daniel-hopium.github.io/${id}/favicon.svg" alt="" width="24" height="24"> ${name}</h3><p>${d}</p><a class="btn btn-secondary" href="https://daniel-hopium.github.io/${id}/?lang=${LANG}">${tx(`${name} öffnen`,`Open ${name}`)}<span class="sr-only"> ${tx('(andere App)','(other app)')}</span>${ic('ext')}</a></div>`).join('')}</div>`;

function startHTML(){
  return `<article class="lesson" aria-labelledby="lesson-title">
  <p class="eyebrow">${tx('Überblick','Overview')}</p>
  <h1 id="lesson-title" tabindex="-1">${APP.tagline}</h1>
  <p class="rule">${APP.intro}</p>
  <div class="start-grid">${CATS.map(c=>{const n=ENTRIES.filter(e=>e.cat===c.id).length;return `<div class="tile"><h3>${c.title}</h3><p>${c.intro}</p><a class="btn btn-secondary" href="#${c.id}">${nEntries(n)}<span class="sr-only"> ${tx('in','in')} ${plain(c.title)}</span></a></div>`}).join('')}</div>
  <h2>${tx('Alle Einträge','All entries')}</h2>
  <div class="field ca-find"><label for="ca-q">${tx('Eintrag suchen','Search entries')} <span class="opt">${tx('Name oder Stichwort','name or keyword')}</span></label><input class="input" id="ca-q" type="search" autocomplete="off" spellcheck="false"></div>
  <p class="count" id="ca-count" role="status"></p>
  <div class="table-wrap" tabindex="0" role="region" aria-label="${tx('Alle Einträge','All entries')}"><table class="table ca-index"><caption class="sr-only">${tx('Alle Einträge','All entries')}</caption><thead><tr><th scope="col">${tx('Eintrag','Entry')}</th><th scope="col">${tx('Worum es geht','What it is about')}</th><th scope="col">${tx('Kapitel','Chapter')}</th></tr></thead><tbody>${ENTRIES.map(e=>`<tr data-q="${esc(norm(`${plain(e.title)} ${plain(e.sub||'')} ${plain(CAT_BY[e.cat].title)} ${e.keys||''} ${plain(e.desc)}`))}"><td><a href="#${e.cat}/${e.id}">${e.title}</a></td><td>${e.sub||''}</td><td>${CAT_BY[e.cat].title}</td></tr>`).join('')}</tbody></table></div>
  <h2>${tx('Die Schwester-Apps','The sister apps')}</h2>
  ${sistersHTML()}
  <nav class="pager" aria-label="${tx('Weiter','Next')}"><a class="next" href="#${CATS[0].id}"><small>${tx('Erstes Kapitel →','First chapter →')}</small>${CATS[0].title}</a></nav>
</article>`;
}
function startInit(root){
  const q=$('#ca-q',root),rows=$$('tbody tr',root),count=$('#ca-count',root);let t;
  const upd=typed=>{const s=norm(q.value.trim());let n=0;rows.forEach(r=>{const ok=!s||r.dataset.q.includes(s);r.hidden=!ok;if(ok)n++});
    clearTimeout(t);t=setTimeout(()=>{count.textContent=s?tx(`${n} von ${ENTRIES.length} Einträgen`,`${n} of ${ENTRIES.length} entries`):nEntries(ENTRIES.length)},typed?400:0)};
  q.addEventListener('input',()=>upd(true));upd(false);
  return ()=>clearTimeout(t);
}

/* ---------- Seitenleiste ---------- */
const listEl=$('#list'),search=$('#q'),qStatus=$('#q-status');
let current=null,statusTimer=null;
function renderList(){
  const q=norm(search.value.trim());
  const hit=e=>!q||norm(`${plain(e.title)} ${plain(e.sub||'')} ${plain(CAT_BY[e.cat].title)} ${e.keys||''}`).includes(q);
  let html=q?'':`<ul class="items"><li><a class="item item-page" href="#start" data-id="start"><span class="item-title">${tx('Überblick','Overview')}</span><span class="item-short">${tx('Alle Kapitel und eine Tabelle aller Einträge.','All chapters and a table of all entries.')}</span></a></li></ul>`,count=0;
  CATS.forEach(c=>{
    const es=ENTRIES.filter(e=>e.cat===c.id&&hit(e));if(!es.length)return;count+=es.length;
    html+=`<a class="grp" id="grp-${c.id}" href="#${c.id}" data-id="${c.id}">${c.title}</a><ul class="items" aria-labelledby="grp-${c.id}">${es.map(e=>`<li><a class="item" href="#${c.id}/${e.id}" data-id="${c.id}/${e.id}"><span class="item-title">${e.title}</span></a></li>`).join('')}</ul>`;
  });
  if(q&&!count)html=`<div class="list-empty">${ic('search')}<p class="le-title">${tx(`Nichts zu „${esc(search.value.trim())}“`,`Nothing for “${esc(search.value.trim())}”`)}</p><p class="hint">${APP.searchHint}</p><button type="button" class="btn btn-secondary" id="q-reset">${tx('Suche zurücksetzen','Clear search')}</button></div>`;
  listEl.innerHTML=html;
  markActive(current,false);
  clearTimeout(statusTimer);
  statusTimer=setTimeout(()=>{qStatus.textContent=q?tx(count===1?'1 Treffer':`${count} Treffer`,count===1?'1 result':`${count} results`):tx(`${ENTRIES.length} Einträge in ${CATS.length} Kapiteln`,`${ENTRIES.length} entries in ${CATS.length} chapters`)},q?450:0);
}
function markActive(id,reveal){
  $$('[data-id]',listEl).forEach(a=>{
    if(a.dataset.id===id){a.setAttribute('aria-current','page');if(reveal)a.scrollIntoView({block:'nearest'})}
    else a.removeAttribute('aria-current');
  });
}
search.addEventListener('input',renderList);
listEl.addEventListener('click',e=>{if(e.target.closest('#q-reset')){search.value='';renderList();search.focus()}});

/* ---------- Detailansicht ---------- */
const view=$('#view'),master=$('#master'),detail=$('#hauptinhalt'),shell=$('#shell');
let cleanup=null;
function notFoundHTML(id){
  return `<article class="lesson" aria-labelledby="lesson-title"><div class="empty">${ic('search')}
  <h1 id="lesson-title" tabindex="-1">${tx('Diese Seite gibt es nicht','This page doesn’t exist')}</h1>
  <p style="margin:0;max-width:60ch">${tx(`Unter <code>#${esc(id)}</code> steht kein Eintrag. Vielleicht hat der Link einen Tippfehler.`,`There is no entry at <code>#${esc(id)}</code>. Maybe the link has a typo.`)}</p>
  <div class="btn-row"><a class="btn btn-primary" href="#start">${tx('Zum Überblick','Go to overview')}</a><button type="button" class="btn btn-secondary" id="nf-search">${tx('Eintrag suchen','Search entries')}</button></div>
  </div></article>`;
}
function updateTitle(base,sub){
  const c=CAT_BY[base],e=BY[sub];
  document.title=c?(e?`${plain(e.title)} · ${plain(c.title)} · ${APP.name}`:`${plain(c.title)} · ${APP.name}`):base==='start'?`${APP.name} – ${APP.tagline}`:tx(`Nicht gefunden · ${APP.name}`,`Not found · ${APP.name}`);
}
let masterScroll=0,lastId=null;
function route(fromUser){
  if(cleanup){try{cleanup()}catch(e){}cleanup=null}
  if(shell.dataset.view==='master')masterScroll=master.scrollTop;
  const id=decodeURIComponent(location.hash.slice(1));
  const overview=id===''||id==='uebersicht';
  let [base,sub='']=id.split(/\/(.*)/);
  // Kurzform #eintrag springt zum Eintrag im richtigen Kapitel
  if(!CAT_BY[base]&&BY[base]){location.replace(`#${BY[base].cat}/${base}`);return}
  shell.dataset.view=overview?'master':'detail';
  let focusEl=null;
  if(overview||base==='start'){base='start';sub='';view.innerHTML=startHTML();cleanup=startInit(view)}
  else if(CAT_BY[base]){
    if(BY[sub]?.cat!==base)sub='';
    view.innerHTML=catHTML(base);cleanup=catInit(view,sub);
    focusEl=sub&&$('#ca-'+sub+'-h',view);
  }
  else{base=null;sub='';view.innerHTML=notFoundHTML(id)}
  withLang(view);
  current=base&&sub?`${base}/${sub}`:base;
  markActive(current,true);updateTitle(base,sub);
  if(!fromUser)return;
  if(overview&&isNarrow()){
    master.scrollTop=masterScroll;
    const a=lastId&&$(`[data-id="${lastId}"]`,listEl);
    (a||search).focus({preventScroll:!!a});
  }else{
    if(!sub)detail.scrollTop=0;
    if(focusEl)focusEl.focus({preventScroll:true});else $('#lesson-title').focus({preventScroll:true});
  }
  if(!overview&&current)lastId=current;
}
window.addEventListener('hashchange',()=>{route(true);updateLangLink()});

/* ---------- Globale Ereignisse ---------- */
document.addEventListener('click',e=>{if(e.target.closest('#nf-search'))focusSearch()});
$('#skip').addEventListener('click',e=>{e.preventDefault();if(isNarrow()&&shell.dataset.view==='master'){search.focus();return}($('#lesson-title')||detail).focus()});
function focusSearch(){
  if(isNarrow()&&shell.dataset.view!=='master'){location.hash='uebersicht';setTimeout(()=>search.focus(),0)}
  else search.focus();
}
// Strg+K statt eines einzelnen Buchstabens: Tastenkürzel mit Modifier kollidieren nicht mit Sprachsteuerung (WCAG 2.1.4)
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&!e.altKey&&e.key.toLowerCase()==='k'){e.preventDefault();focusSearch()}
});

/* ---------- Sprachumschalter ----------
   Ein Link, kein Button: er führt zu einer anderen Adresse (?lang=…) und behält den Hash. Beschriftet in der
   Zielsprache selbst, mit lang-Attribut, damit Screenreader „English“ englisch aussprechen (WCAG 3.1.2). */
function updateLangLink(){const a=$('#lang-link'),o=tx('en','de');a.href=langHref(o);a.hreflang=o;a.lang=o;a.textContent=tx('English','Deutsch')}

/* ---------- Start ---------- */
withLang(document);
updateLangLink();
renderList();
route(false);
})();
</script>
</body>
</html>
